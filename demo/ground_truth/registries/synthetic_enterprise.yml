format_version: 1
registry_id: synthetic_enterprise
version: 1
source: recorded:demo/ground_truth/registries/synthetic_enterprise.yml
catalog_scope: synthetic-demo
logical_context:
  version: 1
  source: recorded:demo/ground_truth/registries/synthetic_enterprise.yml
  models:
    - id: Customer
      description: Approved synthetic customer context for guided request evaluation.
      status: approved
      version: 1
      fields:
        - id: Customer.customer_key
          canonical_type: string
          role: identifier
          definition: Stable identifier for a customer across approved source representations.
          status: approved
          version: 1
        - id: Customer.registration_date
          canonical_type: date
          role: temporal
          definition: Calendar date on which the customer was registered.
          status: approved
          version: 1
        - id: Customer.country_code
          canonical_type: string
          role: attribute
          definition: Approved country code associated with the customer.
          status: approved
          version: 1
        - id: Customer.customer_status
          canonical_type: string
          role: attribute
          definition: Approved lifecycle status of the customer.
          status: approved
          version: 1
    - id: AccountHolder
      description: Approved synthetic relationship between a customer and an account.
      status: approved
      version: 1
      fields:
        - id: AccountHolder.customer_key
          canonical_type: string
          role: identifier
          definition: Approved customer identifier on an account-holder relationship.
          status: approved
          version: 1
        - id: AccountHolder.account_key
          canonical_type: string
          role: identifier
          definition: Approved account identifier on an account-holder relationship.
          status: approved
          version: 1
        - id: AccountHolder.holder_role
          canonical_type: string
          role: attribute
          definition: Approved normalized role of the customer on the account.
          status: approved
          version: 1
    - id: Account
      description: Approved synthetic financial account context.
      status: approved
      version: 1
      fields:
        - id: Account.account_key
          canonical_type: string
          role: identifier
          definition: Stable approved account identifier.
          status: approved
          version: 1
        - id: Account.current_balance
          canonical_type: decimal
          role: measure
          definition: Approved current account balance measure.
          status: approved
          version: 1
    - id: Product
      description: Approved synthetic commerce product catalog.
      status: approved
      version: 1
      fields:
        - id: Product.product_key
          canonical_type: string
          role: identifier
          definition: Stable product identifier normalized across padded and integer sources.
          status: approved
          version: 1
        - id: Product.category
          canonical_type: string
          role: attribute
          definition: Approved business category assigned to the product.
          allowed_values:
            - ELECTRONICS
            - HOME
            - BOOKS
            - SPORTS
          status: approved
          version: 1
        - id: Product.unit_price
          canonical_type: decimal
          role: measure
          definition: Approved catalog unit price in synthetic currency units.
          status: approved
          version: 1
        - id: Product.is_active
          canonical_type: boolean
          role: attribute
          definition: Whether the product is active in the approved catalog snapshot.
          status: approved
          version: 1
        - id: Product.created_at
          canonical_type: timestamp
          role: temporal
          definition: Timestamp when the product entered the synthetic catalog.
          status: approved
          version: 1
    - id: SalesOrder
      description: Approved synthetic commercial order header.
      status: approved
      version: 1
      fields:
        - id: SalesOrder.order_key
          canonical_type: string
          role: identifier
          definition: Stable order identifier normalized from its integer source representation.
          status: approved
          version: 1
        - id: SalesOrder.ordered_at
          canonical_type: timestamp
          role: temporal
          definition: Timestamp when the order was registered.
          status: approved
          version: 1
        - id: SalesOrder.order_status
          canonical_type: string
          role: attribute
          definition: Approved normalized lifecycle status of the order.
          allowed_values:
            - CREATED
            - PAID
            - COMPLETED
            - CANCELLED
          status: approved
          version: 1
        - id: SalesOrder.sales_channel
          canonical_type: string
          role: attribute
          definition: Approved channel through which the order was registered.
          allowed_values:
            - WEB
            - STORE
            - PARTNER
          status: approved
          version: 1
        - id: SalesOrder.region
          canonical_type: string
          role: attribute
          definition: Approved normalized commercial region for the order.
          allowed_values:
            - NORTH
            - SOUTH
            - EAST
            - WEST
          status: approved
          version: 1
        - id: SalesOrder.order_total
          canonical_type: decimal
          role: measure
          definition: Approved gross total recorded on the order header.
          status: approved
          version: 1
    - id: SaleLine
      description: Approved synthetic repeated product line within an order.
      status: approved
      version: 1
      fields:
        - id: SaleLine.line_key
          canonical_type: string
          role: identifier
          definition: Stable synthetic order-line identifier.
          status: approved
          version: 1
        - id: SaleLine.order_key
          canonical_type: string
          role: identifier
          definition: Approved order identifier on an order-line relationship.
          status: approved
          version: 1
        - id: SaleLine.product_key
          canonical_type: string
          role: identifier
          definition: Approved product identifier on an order-line relationship.
          status: approved
          version: 1
        - id: SaleLine.quantity
          canonical_type: integer
          role: measure
          definition: Number of product units represented by the order line.
          status: approved
          version: 1
        - id: SaleLine.net_amount
          canonical_type: decimal
          role: measure
          definition: Approved line amount after any synthetic discount.
          status: approved
          version: 1
        - id: SaleLine.discount_amount
          canonical_type: decimal
          role: measure
          definition: Approved nullable discount amount applied to the line.
          status: approved
          version: 1
    - id: Shipment
      description: Approved synthetic fulfillment attempt for a commercial order.
      status: approved
      version: 1
      fields:
        - id: Shipment.shipment_key
          canonical_type: string
          role: identifier
          definition: Stable synthetic shipment identifier.
          status: approved
          version: 1
        - id: Shipment.order_key
          canonical_type: string
          role: identifier
          definition: Approved normalized order identifier on a shipment.
          status: approved
          version: 1
        - id: Shipment.shipment_status
          canonical_type: string
          role: attribute
          definition: Approved normalized fulfillment status.
          allowed_values:
            - PENDING
            - IN_TRANSIT
            - DELIVERED
            - RETURNED
          status: approved
          version: 1
        - id: Shipment.shipped_at
          canonical_type: timestamp
          role: temporal
          definition: Nullable timestamp when the shipment left fulfillment.
          status: approved
          version: 1
        - id: Shipment.delivered_at
          canonical_type: timestamp
          role: temporal
          definition: Nullable timestamp when delivery completed.
          status: approved
          version: 1
  joins:
    - id: customer_to_account_holder
      left_model: Customer
      right_model: AccountHolder
      cardinality: one_to_many
      fanout_policy: require_distinct_for_left_entity_metrics
      status: approved
      version: 1
      approval_decision_id: ground-truth-customer-holder-v1
    - id: account_holder_to_account
      left_model: AccountHolder
      right_model: Account
      cardinality: many_to_one
      fanout_policy: none
      status: approved
      version: 1
      approval_decision_id: ground-truth-holder-account-v1
    - id: product_to_sale_line
      left_model: Product
      right_model: SaleLine
      cardinality: one_to_many
      fanout_policy: require_distinct_for_left_entity_metrics
      status: approved
      version: 1
      approval_decision_id: ground-truth-product-sale-line-v1
    - id: sales_order_to_sale_line
      left_model: SalesOrder
      right_model: SaleLine
      cardinality: one_to_many
      fanout_policy: require_distinct_for_left_entity_metrics
      status: approved
      version: 1
      approval_decision_id: ground-truth-sales-order-line-v1
    - id: sales_order_to_shipment
      left_model: SalesOrder
      right_model: Shipment
      cardinality: one_to_many
      fanout_policy: require_distinct_for_left_entity_metrics
      status: approved
      version: 1
      approval_decision_id: ground-truth-sales-order-shipment-v1
mapping_set:
  version: 1
  mappings:
    - approval_decision_id: ground-truth-map-customer-key-v1
      logical_field_version: 1
      physical_type: string
      mapping:
        logical_field: Customer.customer_key
        physical_field: crm.customers.customer_id
        confidence: 1.0
        status: approved
        evidence:
          - Approved synthetic CRM mapping used by the governed north-star fixture.
        risks:
          - Padded identifiers require explicit normalization before joining.
        transformation_plan:
          version: 1
          steps:
            - operation: trim
            - operation: validate_regex
              pattern: ^[0-9]+$
            - operation: strip_leading_zeros
            - operation: reject_invalid
