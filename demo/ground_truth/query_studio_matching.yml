version: 1
fixture_notice: >-
  Synthetic multilingual Query Studio labels. They contain no employer, customer, source-row,
  credential, or proprietary data and are not evidence of production accuracy.
positive_mappings:
  - id: customer-key-crm
    logical_field: Customer.customer_key
    connection_id: warehouse-primary
    physical_field: crm.customers.customer_id
    descriptions:
      es: identificador estable del cliente en el maestro de clientes
      en: stable customer identifier in the customer master
  - id: customer-registration-date
    logical_field: Customer.registration_date
    connection_id: warehouse-primary
    physical_field: crm.customers.registration_date
