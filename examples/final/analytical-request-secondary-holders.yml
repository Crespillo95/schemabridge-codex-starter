context_source: recorded:demo/ground_truth/registries/synthetic_enterprise.yml
context_version: 1
request:
  primary_entity: Customer
  dimensions:
  - field: Customer.registration_date
    grain: day
  metrics:
  - operation: count_distinct
    field: Customer.customer_key
    alias: secondary_holder_customers
  filters:
  - field: AccountHolder.holder_role
    operator: equals
    value: SECONDARY
  order_by:
  - field: Customer.registration_date
    direction: asc
  limit: 500
required_models:
- Customer
- AccountHolder
approved_join_contracts:
- customer_to_account_holder
