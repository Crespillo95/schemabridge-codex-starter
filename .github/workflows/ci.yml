name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,postgres,sql,ui,llm]'
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src
      - run: pytest -m 'not integration and not acceptance'

  postgres-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://schemabridge_reader:schemabridge_reader@127.0.0.1:55433/schemabridge
      SCHEMABRIDGE_TEST_DATABASE_URL: postgresql://schemabridge_reader:schemabridge_reader@127.0.0.1:55433/schemabridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,postgres,sql,ui]'
      - run: make demo-reset
      - run: make test-integration
      - run: make test-acceptance
      - run: >-
          python -m schemabridge.entrypoints.cli.main evaluate
          --output reports/evaluation.json
          --markdown reports/evaluation.md
      - run: >-
          python -c "import json; from pathlib import Path;
          report=json.loads(Path('reports/evaluation.json').read_text());
          assert report['successful'] and not report['release']['dirty'];
          assert report['release']['revision'] == '${{ github.sha }}'"
      - if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color postgres
      - if: always()
        run: docker compose -f docker-compose.demo.yml down -v --remove-orphans
