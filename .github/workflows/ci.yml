name: CI

on:
  push:
  pull_request:

env:
  NO_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make bootstrap
      - run: make check
      - run: make runtime-wheel-smoke

  postgres-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://schemabridge_reader:schemabridge_reader@127.0.0.1:55433/schemabridge
      SCHEMABRIDGE_TEST_DATABASE_URL: postgresql://schemabridge_reader:schemabridge_reader@127.0.0.1:55433/schemabridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: make bootstrap
      - run: make install
      - run: make demo-reset
      - run: make datahub-start
      - run: make datahub-health
      - run: make datahub-init-admin
      - run: make datahub-ingest
      - run: make datahub-provision-mcp
      - run: make datahub-provision-writer
      - run: make datahub-catalog-check
      - run: make datahub-mcp-check
      - run: >-
          .venv/bin/schemabridge registry-publish
          --fingerprint ef480eb7370924ff4c94131a2c6c4063d85652cc83aaec9059538cdc2cf9c1b9
          --confirm publish-approved-registry-version
          --json
      - run: make datahub-registry-check
      - run: make control-plane-reset
      - run: make control-plane-migrate
      - run: make control-plane-check
      - run: make test-integration
      - run: make test-acceptance
      - run: make coverage
      - run: >-
          .venv/bin/python -m schemabridge.entrypoints.cli.main evaluate
          --output reports/evaluation.json
          --markdown reports/evaluation.md
      - run: >-
          .venv/bin/python -c "import json; from pathlib import Path;
          report=json.loads(Path('reports/evaluation.json').read_text());
          assert report['successful'] and not report['release']['dirty'];
          assert report['release']['revision'] == '${{ github.sha }}'"
      - if: failure()
        run: docker compose -f docker-compose.demo.yml logs --no-color postgres
      - if: failure()
        run: docker compose -f docker-compose.control.yml logs --no-color control-postgres
      - if: always()
        run: docker compose -f docker-compose.demo.yml down -v --remove-orphans
      - if: always()
        run: docker compose -f docker-compose.control.yml down -v --remove-orphans
