              jq -er '.token | select(type == "string" and length > 0)'
          )"
          candidate_manifest="$RUNNER_TEMP/candidate-manifest.json"
          candidate_headers="$RUNNER_TEMP/candidate-manifest.headers"
          response_code="$(
            curl --silent --show-error \
              --max-filesize 4194304 \
              --output "$candidate_manifest" \
              --dump-header "$candidate_headers" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$registry_path/manifests/$CANDIDATE_TAG"
          )"
          test "$(stat --format='%s' "$candidate_manifest")" -le 4194304
          test "$response_code" = "200"
          test "sha256:$(sha256sum "$candidate_manifest" | cut -d' ' -f1)" = "$IMAGE_DIGEST"
          test "$(jq -r '.config.digest' "$candidate_manifest")" = "$IMAGE_ID"
          test "$(
            awk 'tolower($1) == "docker-content-digest:" {print $2}' \
              "$candidate_headers" |
              tr -d '\r' |
