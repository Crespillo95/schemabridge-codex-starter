          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          verify_default_head
          verify_authoritative_release_controls
      - name: Validate protected environment sentinel before first mutation
        shell: bash
        env:
          RELEASE_APPROVAL_SENTINEL: ${{ secrets.SCHEMABRIDGE_RELEASE_APPROVAL_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_APPROVAL_SENTINEL" =~ ^[A-Za-z0-9._-]{32,128}$ ]]
      - name: Promote or verify the exact candidate manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTOR: ${{ github.actor }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_authoritative_release_controls() {
            local immutable_releases
            local ruleset
            local ruleset_id
            [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
            local audit_repository
            audit_repository="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY"
            )"
            test "$(jq -r '.permissions.push == true' <<<"$audit_repository")" = "true"
            ruleset_id="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -er '[.[][] | select(.enforcement == "active") | .id]
                  | select(
                      length == 1
                      and .[0] != null
                      and (.[0] | type == "number" and . > 0)
                    )
                  | .[0]'
            )"
            ruleset="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
            )"
            test "$(
              jq -r '
                .target == "tag"
                and .enforcement == "active"
                and has("bypass_actors")
                and (.bypass_actors | type == "array" and length == 0)
                and .conditions.ref_name.include == ["refs/tags/v*"]
                and .conditions.ref_name.exclude == []
                and ([.rules[].type] | sort)
                  == ["deletion", "non_fast_forward", "update"]
              ' <<<"$ruleset"
            )" = "true"
            immutable_releases="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/immutable-releases"
            )"
            test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          registry_path="${IMAGE_NAME#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error \
              --user "$REGISTRY_ACTOR:$GH_TOKEN" \
              --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:$registry_path:pull,push" \
              https://ghcr.io/token |
              jq -er '.token | select(type == "string" and length > 0)'
          )"
          inspect_manifest() {
            local reference="$1"
            local body
            local code
            local config_digest
            local digest
            local header_digest
            local headers
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(
              curl --silent --show-error \
                --max-filesize 4194304 \
                --output "$body" \
                --dump-header "$headers" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/$registry_path/manifests/$reference"
            )"
            test "$(stat --format='%s' "$body")" -le 4194304
            if [[ "$code" = "404" ]]; then
              jq -e '.errors | length > 0 and all(
                .code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN"
              )' "$body" >/dev/null
              return 4
            fi
            test "$code" = "200"
            digest="sha256:$(sha256sum "$body" | cut -d' ' -f1)"
            header_digest="$(
              awk 'tolower($1) == "docker-content-digest:" {print $2}' "$headers" |
                tr -d '\r' |
                tail -1
            )"
            test "$header_digest" = "$digest"
            config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$body")"
            printf '%s|%s\n' "$digest" "$config_digest"
          }
          candidate_state="$(inspect_manifest "$CANDIDATE_TAG")"
          test "${candidate_state%%|*}" = "$IMAGE_DIGEST"
          test "${candidate_state##*|}" = "$IMAGE_ID"
          if final_state="$(inspect_manifest "$RELEASE_TAG")"; then
            test "${final_state%%|*}" = "$IMAGE_DIGEST"
            test "${final_state##*|}" = "$IMAGE_ID"
            exit 0
          else
            test "$?" = "4"
          fi
          candidate_manifest="$RUNNER_TEMP/candidate-manifest.json"
          candidate_headers="$RUNNER_TEMP/candidate-manifest.headers"
          response_code="$(
            curl --silent --show-error \
              --max-filesize 4194304 \
              --output "$candidate_manifest" \
              --dump-header "$candidate_headers" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $registry_token" \
              --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/$registry_path/manifests/$CANDIDATE_TAG"
          )"
          test "$(stat --format='%s' "$candidate_manifest")" -le 4194304
          test "$response_code" = "200"
          test "sha256:$(sha256sum "$candidate_manifest" | cut -d' ' -f1)" = "$IMAGE_DIGEST"
          media_type="$(
            jq -er '.mediaType | select(
              . == "application/vnd.oci.image.manifest.v1+json"
              or . == "application/vnd.docker.distribution.manifest.v2+json"
            )' "$candidate_manifest"
          )"
          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          verify_default_head
          verify_authoritative_release_controls
          promotion_headers="$RUNNER_TEMP/promotion.headers"
          promotion_code="$(
            curl --silent --show-error \
              --max-filesize 4194304 \
              --output /dev/null \
              --dump-header "$promotion_headers" \
              --write-out '%{http_code}' \
              --request PUT \
              --header "Authorization: Bearer $registry_token" \
              --header "Content-Type: $media_type" \
              --data-binary @"$candidate_manifest" \
              "https://ghcr.io/v2/$registry_path/manifests/$RELEASE_TAG"
          )"
          test "$promotion_code" = "201"
          test "$(
            awk 'tolower($1) == "docker-content-digest:" {print $2}' "$promotion_headers" |
              tr -d '\r' |
              tail -1
          )" = "$IMAGE_DIGEST"
          final_state="$(inspect_manifest "$RELEASE_TAG")"
          test "${final_state%%|*}" = "$IMAGE_DIGEST"
          test "${final_state##*|}" = "$IMAGE_ID"

  release:
    needs:
      - scan
      - attest
      - promote
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      actions: read
      attestations: read
      contents: write
      packages: read
    env:
      ARTIFACT_DIGEST: ${{ needs.scan.outputs.artifact-digest }}
      ARTIFACT_ID: ${{ needs.scan.outputs.artifact-id }}
      ARTIFACT_NAME: ${{ needs.scan.outputs.artifact-name }}
      CANDIDATE_TAG: ${{ needs.scan.outputs.candidate-tag }}
      IMAGE_DIGEST: ${{ needs.scan.outputs.image-digest }}
      IMAGE_ID: ${{ needs.scan.outputs.image-id }}
      IMAGE_NAME: ${{ needs.scan.outputs.image-name }}
      RELEASE_PAYLOAD_DIRECTORY: .local/release-payload
    steps:
      - name: Verify canonical payload and every boundary before first content mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTOR: ${{ github.actor }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_authoritative_release_controls() {
            local active_rulesets=0
            local immutable_releases
            local ruleset_ids
            local ruleset
            local ruleset_id
            [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
            local audit_repository
            audit_repository="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY"
            )"
            test "$(jq -r '.permissions.push == true' <<<"$audit_repository")" = "true"
            ruleset_ids="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -cer '[.[][] | .id] as $ids
                  | select(
                      length == ($ids | unique | length)
                      and all(type == "number" and . > 0)
                    )
                  | sort'
            )"
            while IFS= read -r ruleset_id; do
              test -n "$ruleset_id"
              ruleset="$(
                GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                  gh api --method GET \
                    --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                    "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
              )"
              if [[ "$(jq -r '.enforcement' <<<"$ruleset")" = "active" ]]; then
                active_rulesets=$((active_rulesets + 1))
                test "$(
                  jq -r '
                    .target == "tag"
                    and .enforcement == "active"
                    and has("bypass_actors")
                    and (.bypass_actors | type == "array" and length == 0)
                    and .conditions.ref_name.include == ["refs/tags/v*"]
                    and .conditions.ref_name.exclude == []
                    and ([.rules[].type] | sort)
                      == ["deletion", "non_fast_forward", "update"]
                  ' <<<"$ruleset"
                )" = "true"
              fi
            done < <(jq -r '.[]' <<<"$ruleset_ids")
            test "$active_rulesets" = "1"
            immutable_releases="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/immutable-releases"
            )"
            test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact_payload="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          )"
          test "$(jq -r '.id | tostring' <<<"$artifact_payload")" = "$ARTIFACT_ID"
          test "$(jq -r '.name' <<<"$artifact_payload")" = "$ARTIFACT_NAME"
          test "$(jq -r '.expired' <<<"$artifact_payload")" = "false"
          test "$(jq -r '.digest' <<<"$artifact_payload")" = "sha256:$ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id | tostring' <<<"$artifact_payload")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact_payload")" = "$SOURCE_REVISION"
          artifact_size="$(
            jq -er '.size_in_bytes | select(type == "number" and . > 0 and . <= 1073741824)' \
              <<<"$artifact_payload"
          )"
