          verify_default_head
          verify_authoritative_release_controls
          registry_path="${IMAGE_NAME#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error \
              --user "$REGISTRY_ACTOR:$GH_TOKEN" \
              --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:$registry_path:pull" \
              https://ghcr.io/token |
              jq -er '.token | select(type == "string" and length > 0)'
          )"
          inspect_manifest() {
            local reference="$1"
            local body
            local code
            local config_digest
            local digest
            local header_digest
            local headers
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(
              curl --silent --show-error \
                --max-filesize 4194304 \
                --output "$body" \
                --dump-header "$headers" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/$registry_path/manifests/$reference"
            )"
            test "$(stat --format='%s' "$body")" -le 4194304
            test "$code" = "200"
            digest="sha256:$(sha256sum "$body" | cut -d' ' -f1)"
            header_digest="$(
              awk 'tolower($1) == "docker-content-digest:" {print $2}' "$headers" |
                tr -d '\r' |
                tail -1
            )"
            test "$header_digest" = "$digest"
            config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$body")"
            printf '%s|%s\n' "$digest" "$config_digest"
          }
          candidate_state="$(inspect_manifest "$CANDIDATE_TAG")"
          test "${candidate_state%%|*}" = "$IMAGE_DIGEST"
          test "${candidate_state##*|}" = "$IMAGE_ID"
          final_state="$(inspect_manifest "$RELEASE_TAG")"
          test "${final_state%%|*}" = "$IMAGE_DIGEST"
          test "${final_state##*|}" = "$IMAGE_ID"
          for subject in \
            direct-licenses.json \
            pip-audit.json \
            provenance.intoto.json \
            release-assets.sha256 \
            release-body.md \
            release-metadata.json \
            runtime-image.cdx.json \
            schemabridge-0.1.0-py3-none-any.whl \
            trivy-image.json \
            wheel.cdx.json
          do
            gh attestation verify "$RELEASE_PAYLOAD_DIRECTORY/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
              --source-digest "$SOURCE_REVISION" \
              --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners
          done
          gh attestation verify "oci://$IMAGE_NAME@$IMAGE_DIGEST" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
            --source-digest "$SOURCE_REVISION" \
            --source-ref "$SOURCE_REF" \
            --deny-self-hosted-runners \
            --bundle-from-oci
      - name: Validate protected environment sentinel before first mutation
        shell: bash
        env:
          RELEASE_APPROVAL_SENTINEL: ${{ secrets.SCHEMABRIDGE_RELEASE_APPROVAL_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_APPROVAL_SENTINEL" =~ ^[A-Za-z0-9._-]{32,128}$ ]]
      - name: Create, resume, or publish the canonical release as the final operation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_authoritative_release_controls() {
            local immutable_releases
            local ruleset
            local ruleset_id
            [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
            local audit_repository
            audit_repository="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY"
            )"
            test "$(jq -r '.permissions.push == true' <<<"$audit_repository")" = "true"
            ruleset_id="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -er '[.[][] | select(.enforcement == "active") | .id]
                  | select(
                      length == 1
                      and .[0] != null
                      and (.[0] | type == "number" and . > 0)
                    )
                  | .[0]'
            )"
            ruleset="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
            )"
            test "$(
              jq -r '
                .target == "tag"
                and .enforcement == "active"
                and has("bypass_actors")
                and (.bypass_actors | type == "array" and length == 0)
                and .conditions.ref_name.include == ["refs/tags/v*"]
                and .conditions.ref_name.exclude == []
                and ([.rules[].type] | sort)
                  == ["deletion", "non_fast_forward", "update"]
              ' <<<"$ruleset"
            )" = "true"
            immutable_releases="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/immutable-releases"
            )"
            test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          release_matches() {
            gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]'
          }
          fetch_release() {
            local release_id="$1"
            gh api --method GET \
              --header "X-GitHub-Api-Version: $GH_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
          }
          fetch_assets() {
            local release_id="$1"
            gh api --method GET --paginate --slurp \
              --header "X-GitHub-Api-Version: $GH_API_VERSION" \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" |
              jq -c '[.[][]]'
          }
          canonical_stable_semver() {
            [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          }
          semver_greater() {
            local left="${1#v}"
            local right="${2#v}"
            local index
            local -a left_parts=()
            local -a right_parts=()
            IFS='.' read -r -a left_parts <<< "$left"
            IFS='.' read -r -a right_parts <<< "$right"
            for index in 0 1 2; do
              if ((${#left_parts[$index]} > ${#right_parts[$index]})); then
                return 0
              fi
              if ((${#left_parts[$index]} < ${#right_parts[$index]})); then
                return 1
              fi
              if [[ "${left_parts[$index]}" > "${right_parts[$index]}" ]]; then
                return 0
              fi
              if [[ "${left_parts[$index]}" < "${right_parts[$index]}" ]]; then
                return 1
              fi
            done
            return 1
          }
          reject_newer_stable_release() {
            local published_tag
            while IFS= read -r published_tag; do
              test -n "$published_tag"
              canonical_stable_semver "$published_tag"
              if semver_greater "$published_tag" "$RELEASE_TAG"; then
                return 1
              fi
            done < <(
              gh api --method GET --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
                jq -r '.[][] | select(
                  .draft == false
                  and .prerelease == false
                  and (.tag_name | startswith("v"))
              ) | .tag_name'
            )
          }
          verify_release_identity() {
            local release="$1"
            local release_id="$2"
            local body_digest
            body_digest="$(
              sha256sum "$RELEASE_PAYLOAD_DIRECTORY/release-body.md" | cut -d' ' -f1
            )"
            test "$(jq -r '.id' <<<"$release")" = "$release_id"
            test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
            test "$(jq -r '.name' <<<"$release")" = "$RELEASE_TAG"
            test "$(jq -r '.target_commitish' <<<"$release")" = "$SOURCE_REVISION"
            test "$(jq -r '.prerelease' <<<"$release")" = "false"
            test "$(
              jq -jr '.body' <<<"$release" | sha256sum | cut -d' ' -f1
            )" = "$body_digest"
            test "$(jq -r '.body_sha256' \
              "$RELEASE_PAYLOAD_DIRECTORY/release-payload.json")" = "$body_digest"
            test "$(jq -r '.release_body_sha256' \
              "$RELEASE_PAYLOAD_DIRECTORY/release-metadata.json")" = "$body_digest"
          }
          verify_assets_exact() {
            local assets
            local asset_count
            local expected_digest
            local expected_size
            local filename
            local release_id="$1"
            assets="$(fetch_assets "$release_id")"
            test "$(
              jq '([.[].name] | sort) == ([
                  "direct-licenses.json",
                  "pip-audit.json",
                  "provenance.intoto.json",
                  "release-assets.sha256",
                  "release-body.md",
                  "release-metadata.json",
                  "runtime-image.cdx.json",
                  "schemabridge-0.1.0-py3-none-any.whl",
                  "trivy-image.json",
                  "wheel.cdx.json"
                ] | sort)
                and ([.[].name] | length) == 10
                and ([.[].name] | unique | length) == 10
              ' <<<"$assets"
            )" = "true"
            for filename in \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json
            do
              expected_digest="sha256:$(
                sha256sum "$RELEASE_PAYLOAD_DIRECTORY/$filename" | cut -d' ' -f1
              )"
              expected_size="$(stat --format='%s' "$RELEASE_PAYLOAD_DIRECTORY/$filename")"
              asset_count="$(
                jq --arg name "$filename" '[.[] | select(.name == $name)] | length' <<<"$assets"
              )"
              test "$asset_count" = "1"
              test "$(
                jq -r --arg name "$filename" '
                  [.[] | select(.name == $name)]
                  | if length == 1 then .[0].digest else "" end
                ' <<<"$assets"
              )" = "$expected_digest"
              test "$(
                jq -r --arg name "$filename" '
                  [.[] | select(.name == $name)]
                  | if length == 1 then .[0].size else "" end
                ' <<<"$assets"
              )" = "$expected_size"
              test "$(
                jq -r --arg name "$filename" '
                  [.[] | select(.name == $name)]
                  | if length == 1 then .[0].state else "" end
                ' <<<"$assets"
              )" = "uploaded"
            done
          }
          reconcile_draft_assets() {
            local assets
            local asset_count
            local expected_digest
            local filename
            local release_id="$1"
            assets="$(fetch_assets "$release_id")"
            test "$(
              jq '([.[].name] | length) <= 10
                and ([.[].name] | unique | length) == ([.[].name] | length)
                and all(
                  .[];
                  .name as $name
                  | [
                    "direct-licenses.json",
                    "pip-audit.json",
                    "provenance.intoto.json",
                    "release-assets.sha256",
                    "release-body.md",
                    "release-metadata.json",
                    "runtime-image.cdx.json",
                    "schemabridge-0.1.0-py3-none-any.whl",
                    "trivy-image.json",
                    "wheel.cdx.json"
                  ] | index($name) != null
                )
              ' <<<"$assets"
            )" = "true"
            for filename in \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json
            do
              expected_digest="sha256:$(
                sha256sum "$RELEASE_PAYLOAD_DIRECTORY/$filename" | cut -d' ' -f1
              )"
              asset_count="$(
                jq --arg name "$filename" '[.[] | select(.name == $name)] | length' <<<"$assets"
              )"
              if [[ "$asset_count" = "0" ]]; then
                gh release upload "$RELEASE_TAG" "$RELEASE_PAYLOAD_DIRECTORY/$filename"
              else
                test "$asset_count" = "1"
                test "$(
                  jq -r --arg name "$filename" '.[] | select(.name == $name) | .digest' \
                    <<<"$assets"
                )" = "$expected_digest"
              fi
            done
            verify_assets_exact "$release_id"
          }
          verify_exact_published_release() {
            local release="$1"
            local release_id="$2"
            verify_release_identity "$release" "$release_id"
            test "$(jq -r '.draft' <<<"$release")" = "false"
            test "$(jq -r '.immutable' <<<"$release")" = "true"
            jq -e '.published_at
              | type == "string"
                and test(
                  "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                )' <<<"$release" >/dev/null
            verify_assets_exact "$release_id"
          }
          verify_postpublication_current_latest() {
            local latest_release
            local release="$1"
            local release_id="$2"
            verify_exact_published_release "$release" "$release_id"
            latest_release="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/releases/latest"
            )"
            test "$(jq -r '.id' <<<"$latest_release")" = "$release_id"
            test "$(jq -r '.tag_name' <<<"$latest_release")" = "$RELEASE_TAG"
            test "$(jq -r '.draft' <<<"$latest_release")" = "false"
            test "$(jq -r '.immutable' <<<"$latest_release")" = "true"
            reject_newer_stable_release
          }
          canonical_stable_semver "$RELEASE_TAG"
          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          verify_default_head
          verify_authoritative_release_controls
          releases="$(release_matches)"
          test "$(jq 'length <= 1' <<<"$releases")" = "true"
          if [[ "$(jq 'length' <<<"$releases")" = "0" ]]; then
            reject_newer_stable_release
            gh release create "$RELEASE_TAG" \
              "$RELEASE_PAYLOAD_DIRECTORY/direct-licenses.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/pip-audit.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/provenance.intoto.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/release-assets.sha256" \
              "$RELEASE_PAYLOAD_DIRECTORY/release-body.md" \
              "$RELEASE_PAYLOAD_DIRECTORY/release-metadata.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/runtime-image.cdx.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/schemabridge-0.1.0-py3-none-any.whl" \
              "$RELEASE_PAYLOAD_DIRECTORY/trivy-image.json" \
              "$RELEASE_PAYLOAD_DIRECTORY/wheel.cdx.json" \
              --draft \
              --verify-tag \
              --target "$SOURCE_REVISION" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_PAYLOAD_DIRECTORY/release-body.md"
            releases="$(release_matches)"
          fi
          test "$(jq 'length' <<<"$releases")" = "1"
          release_id="$(jq -er '.[0].id | select(type == "number" and . > 0)' <<<"$releases")"
          release="$(fetch_release "$release_id")"
          verify_release_identity "$release" "$release_id"
          if [[ "$(jq -r '.draft' <<<"$release")" = "false" ]]; then
            verify_exact_published_release "$release" "$release_id"
            exit 0
          fi
          test "$(jq -r '.draft' <<<"$release")" = "true"
          test "$(jq -r '.immutable' <<<"$release")" = "false"
          reconcile_draft_assets "$release_id"
          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          verify_default_head
          verify_authoritative_release_controls
          reject_newer_stable_release
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest
          release="$(fetch_release "$release_id")"
          verify_postpublication_current_latest "$release" "$release_id"
