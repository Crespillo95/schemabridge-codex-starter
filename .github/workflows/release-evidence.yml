      - name: Authenticate the read-only registry pull used by Trivy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          test -s "$DOCKER_CONFIG/config.json"
          test "$(
            jq -r '.auths["ghcr.io"] | type == "object"' "$DOCKER_CONFIG/config.json"
          )" = "true"
      - name: Generate the registry-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
