name: Release evidence

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  NO_COLOR: "1"

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    env:
      EVIDENCE_DIRECTORY: .local/supply-chain
      REPOSITORY_URL: https://github.com/${{ github.repository }}
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Require the protected release approval sentinel
        shell: bash
        env:
          RELEASE_APPROVAL_SENTINEL: ${{ secrets.SCHEMABRIDGE_RELEASE_APPROVAL_SENTINEL }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_APPROVAL_SENTINEL" =~ ^[A-Za-z0-9._-]{32,128}$ ]]; then
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Resolve the lowercase GHCR image name
        id: image_name
        shell: bash
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$REPOSITORY_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            exit 1
          fi
          image_name="ghcr.io/${REPOSITORY_SLUG,,}"
          printf 'name=%s\n' "$image_name" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.30"
          enable-cache: true
      - name: Require the release tag to resolve to the event revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - name: Install and verify frozen inputs
        run: |
          make bootstrap
          make supply-chain-static
          .venv/bin/python scripts/release_audit.py --require-release
      - name: Build the wheel once
        run: >-
          .venv/bin/uv build --wheel --no-build-isolation --no-create-gitignore
          --out-dir "$EVIDENCE_DIRECTORY/dist"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish the runtime image once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runtime
          build-args: |
            SCHEMABRIDGE_RELEASE_REF=${{ github.sha }}
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image_name.outputs.name }}:${{ github.sha }}
      - name: Generate the complete runtime-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_name.outputs.name }}@${{ steps.build.outputs.digest }}
          cache-dir: .local/trivy-cache
          format: cyclonedx
          output: .local/supply-chain/runtime-image.cdx.json
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ${{ steps.image_name.outputs.name }}@${{ steps.build.outputs.digest }}
          cache-dir: .local/trivy-cache
          scanners: vuln
          format: json
          output: .local/supply-chain/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: true
          exit-code: "0"
      - name: Audit exact Python runtime dependencies
        run: |
          set +e
          .venv/bin/pip-audit --disable-pip --require-hashes --format json \
            --output "$EVIDENCE_DIRECTORY/pip-audit.json" \
            --requirement requirements/runtime.txt \
            --requirement requirements/build.txt \
            --requirement requirements/watchdog-build.txt
          audit_status=$?
          set -e
          if [[ "$audit_status" -gt 1 ]]; then
            exit "$audit_status"
          fi
      - name: Generate and verify unsigned evidence
        env:
          IMAGE_NAME: ${{ steps.image_name.outputs.name }}
        run: |
          wheel_path="$(find "$EVIDENCE_DIRECTORY/dist" -maxdepth 1 -type f -name '*.whl')"
          test -n "$wheel_path"
          test "$(printf '%s\n' "$wheel_path" | wc -l | tr -d ' ')" = "1"
          .venv/bin/python scripts/verify_supply_chain.py generate-evidence \
            --repository "$REPOSITORY_URL" \
            --revision "$SOURCE_REVISION" \
            --wheel "$wheel_path" \
            --image-name "$IMAGE_NAME" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --output-directory "$EVIDENCE_DIRECTORY" \
            --workflow ".github/workflows/release-evidence.yml"
          .venv/bin/python scripts/verify_supply_chain.py vulnerabilities \
            --report "$EVIDENCE_DIRECTORY/pip-audit.json" \
            --report "$EVIDENCE_DIRECTORY/trivy-image.json" \
            --image-name "$IMAGE_NAME" \
            --image-digest "${{ steps.build.outputs.digest }}"
          .venv/bin/python scripts/verify_supply_chain.py verify-evidence \
            --repository "$REPOSITORY_URL" \
            --revision "$SOURCE_REVISION" \
            --wheel "$wheel_path" \
            --image-name "$IMAGE_NAME" \
            --image-digest "${{ steps.build.outputs.digest }}" \
            --output-directory "$EVIDENCE_DIRECTORY" \
            --workflow ".github/workflows/release-evidence.yml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-supply-chain-evidence-${{ github.sha }}
          path: |
            .local/supply-chain/dist/*.whl
            .local/supply-chain/wheel.cdx.json
            .local/supply-chain/runtime-image.cdx.json
            .local/supply-chain/provenance.intoto.json
            .local/supply-chain/direct-licenses.json
            .local/supply-chain/pip-audit.json
            .local/supply-chain/trivy-image.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 35
      - name: Create the GitHub-hosted wheel attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: .local/supply-chain/dist/*.whl
      - name: Create GitHub-hosted SBOM and provenance attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            .local/supply-chain/wheel.cdx.json
            .local/supply-chain/runtime-image.cdx.json
            .local/supply-chain/provenance.intoto.json
      - name: Publish the runtime-image provenance attestation to GHCR
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.image_name.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
