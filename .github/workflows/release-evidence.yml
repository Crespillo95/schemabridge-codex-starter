                      or path.is_absolute()
                      or len(path.parts) != 1
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or entry.is_dir()
                      or entry.flag_bits & 0x1
                      or file_type not in {0, stat.S_IFREG}
                      or entry.file_size <= 0
                      or entry.file_size > 1073741824
                      or entry.compress_size <= 0
