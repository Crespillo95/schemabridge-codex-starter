      - name: Block vulnerable registry image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ env.IMAGE_DIGEST }}
          cache-dir: .local/trivy-cache
          scanners: vuln
          format: json
          output: .local/raw-evidence/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: true
          exit-code: "1"
          version: v0.69.3
      - name: Capture the exact temporal scanner and vulnerability database identity
        shell: bash
        run: |
          set -euo pipefail
          trivy_version="$(
            trivy --version |
              sed -nE 's/^Version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' |
              head -1
          )"
          test "$trivy_version" = "0.69.3"
          database_metadata=".local/trivy-cache/db/metadata.json"
          database_file=".local/trivy-cache/db/trivy.db"
          test -s "$database_metadata"
          test -s "$database_file"
          database_size="$(stat --format='%s' "$database_file")"
          [[ "$database_size" =~ ^[1-9][0-9]*$ ]]
          test "$database_size" -le 1073741824
          database_sha256="$(sha256sum "$database_file" | cut -d' ' -f1)"
          metadata_sha256="$(sha256sum "$database_metadata" | cut -d' ' -f1)"
          [[ "$database_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$metadata_sha256" =~ ^[0-9a-f]{64}$ ]]
          schema_version="$(
            jq -er '.Version | select(type == "number" and . > 0)' "$database_metadata"
          )"
          updated_at="$(
            jq -er '.UpdatedAt | select(
              type == "string"
              and test(
                "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
              )
            )' "$database_metadata"
          )"
          next_update="$(
            jq -er '.NextUpdate | select(
              type == "string"
              and test(
                "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
              )
            )' "$database_metadata"
          )"
          downloaded_at="$(
            jq -er '.DownloadedAt | select(
              type == "string"
              and test(
                "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
              )
            )' "$database_metadata"
          )"
          observed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          jq -nS \
            --arg action_revision "ed142fd0673e97e23eac54620cfb913e5ce36c25" \
            --arg database_sha256 "$database_sha256" \
            --arg downloaded_at "$downloaded_at" \
            --arg metadata_sha256 "$metadata_sha256" \
            --arg next_update "$next_update" \
            --arg observed_at "$observed_at" \
            --arg tool_version "$trivy_version" \
            --arg updated_at "$updated_at" \
            --argjson database_size "$database_size" \
            --argjson schema_version "$schema_version" \
            '{
              action: "aquasecurity/trivy-action",
              action_revision: $action_revision,
              observed_at: $observed_at,
              tool: "trivy",
              tool_version: $tool_version,
              vulnerability_database: {
                byte_size: $database_size,
                downloaded_at: $downloaded_at,
                metadata_sha256: $metadata_sha256,
                next_update: $next_update,
                schema_version: $schema_version,
                sha256: $database_sha256,
                updated_at: $updated_at
              }
            }' > "$RAW_EVIDENCE_DIRECTORY/scanner-evidence.json"
      - name: Remove the read-only registry credential after scanning
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cleanup_status=0
          if [[ -s "$DOCKER_CONFIG/config.json" ]]; then
            if jq -e '.auths["ghcr.io"] | type == "object"' \
                "$DOCKER_CONFIG/config.json" >/dev/null; then
              if docker logout ghcr.io; then
                :
              else
                cleanup_status=1
              fi
            else
              cleanup_status=1
            fi
          fi
          if [[ -e "$DOCKER_CONFIG/config.json" ]]; then
            if jq -e '(.auths["ghcr.io"] // null) == null' \
                "$DOCKER_CONFIG/config.json" >/dev/null; then
              :
            else
              cleanup_status=1
            fi
          fi
          if rm -f "$DOCKER_CONFIG/config.json"; then
            :
          else
            cleanup_status=1
          fi
          if [[ -d "$DOCKER_CONFIG" ]]; then
            if rmdir "$DOCKER_CONFIG"; then
              :
            else
              cleanup_status=1
            fi
          fi
          exit "$cleanup_status"
      - name: Derive canonical public evidence using runner tools
        shell: bash
        env:
          LOCAL_IMAGE_ID: ${{ needs.candidate.outputs.image-id }}
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_ASSETS_DIRECTORY" "$RELEASE_PAYLOAD_DIRECTORY"
          manifest="$PREPARED_DIRECTORY/prepared-manifest.json"
          lock_digest="$(jq -er '.uv_lock_sha256 | select(test("^[0-9a-f]{64}$"))' "$manifest")"
          normalized_digest="${IMAGE_DIGEST#sha256:}"
          test "$(jq -r '.bomFormat' "$RAW_EVIDENCE_DIRECTORY/runtime-image.cdx.json")" = "CycloneDX"
          test "$(
            jq '[.components[]?] | length > 0' "$RAW_EVIDENCE_DIRECTORY/runtime-image.cdx.json"
          )" = "true"
          prepared_components="$(
            jq -cS '[
              .components[]?
              | {
                  name,
                  purl,
                  type,
                  version
                }
            ] | sort_by(.purl, .name, .version, .type)' \
              "$PREPARED_DIRECTORY/runtime-image.cdx.json"
          )"
          registry_components="$(
            jq -cS '[
              .components[]?
              | {
                  name,
                  purl,
                  type,
                  version
                }
            ] | sort_by(.purl, .name, .version, .type)' \
              "$RAW_EVIDENCE_DIRECTORY/runtime-image.cdx.json"
          )"
          test "$registry_components" = "$prepared_components"
          jq -S \
            --arg digest "$normalized_digest" \
            --arg image "$IMAGE_NAME@$IMAGE_DIGEST" \
            --arg lock "$lock_digest" \
            --arg revision "$SOURCE_REVISION" '
              del(.serialNumber, .metadata.timestamp)
              | .metadata.component.name = $image
              | .metadata.component.hashes = [{"alg": "SHA-256", "content": $digest}]
              | .metadata.component.properties = (
                  [
                    (.metadata.component.properties // [])[]
                    | select(
                        .name != "schemabridge:source-revision"
                        and .name != "schemabridge:uv-lock-sha256"
                      )
                  ]
                  + [
                    {"name": "schemabridge:source-revision", "value": $revision},
                    {"name": "schemabridge:uv-lock-sha256", "value": $lock}
                  ]
                )
            ' "$PREPARED_DIRECTORY/runtime-image.cdx.json" \
            > "$RELEASE_ASSETS_DIRECTORY/runtime-image.cdx.json"
          jq -S \
            --arg image "$IMAGE_NAME@$IMAGE_DIGEST" '
              del(.CreatedAt)
              | .ArtifactName = $image
              | del(.Metadata.RepoTags)
              | .Metadata.RepoDigests = [$image]
            ' "$RAW_EVIDENCE_DIRECTORY/trivy-image.json" \
            > "$RELEASE_ASSETS_DIRECTORY/trivy-image.json"
          test "$(
            jq '[.Results[]?.Vulnerabilities[]?] | length' \
              "$RELEASE_ASSETS_DIRECTORY/trivy-image.json"
          )" = "0"
          test "$(
            jq --arg config "$LOCAL_IMAGE_ID" --arg reference "$IMAGE_NAME@$IMAGE_DIGEST" '
              .SchemaVersion == 2
              and .ArtifactName == $reference
              and .ArtifactType == "container_image"
              and (.Metadata | type == "object")
              and .Metadata.ImageID == $config
              and (.Metadata.RepoDigests | type == "array" and index($reference) != null)
              and (
                .Metadata.DiffIDs
                | type == "array"
                  and length > 0
                  and all(test("^sha256:[0-9a-f]{64}$"))
              )
              and (
                .Results
                | type == "array"
                  and length > 0
                  and any(.Packages | type == "array" and length > 0)
                  and all(
                    (.Target | type == "string" and length > 0)
                    and (.Class | type == "string" and length > 0)
                    and (.Type | type == "string" and length > 0)
                    and (
                      (.Packages == null)
                      or (.Packages | type == "array")
                    )
                    and (
                      (.Vulnerabilities == null)
                      or (
                        .Vulnerabilities
                        | type == "array"
                          and all(
                            (.VulnerabilityID | type == "string" and length > 0)
                            and (.PkgName | type == "string" and length > 0)
                            and (
                              (.Severity | ascii_upcase) == "HIGH"
                              or (.Severity | ascii_upcase) == "CRITICAL"
                            )
                          )
                      )
                    )
                  )
              )
            ' "$RELEASE_ASSETS_DIRECTORY/trivy-image.json"
          )" = "true"
          test "$(
            jq -r '.Metadata.ImageID
              | select(test("^sha256:[0-9a-f]{64}$"))' \
              "$RELEASE_ASSETS_DIRECTORY/trivy-image.json"
          )" = "$LOCAL_IMAGE_ID"
          cp "$PREPARED_DIRECTORY/direct-licenses.json" "$RELEASE_ASSETS_DIRECTORY/"
          cp "$PREPARED_DIRECTORY/pip-audit.json" "$RELEASE_ASSETS_DIRECTORY/"
          cp "$PREPARED_DIRECTORY/wheel.cdx.json" "$RELEASE_ASSETS_DIRECTORY/"
          cp "$PREPARED_DIRECTORY/schemabridge-0.1.0-py3-none-any.whl" \
            "$RELEASE_ASSETS_DIRECTORY/"
          wheel_digest="$(
            sha256sum "$RELEASE_ASSETS_DIRECTORY/schemabridge-0.1.0-py3-none-any.whl" |
              cut -d' ' -f1
          )"
          wheel_sbom_digest="$(
            sha256sum "$RELEASE_ASSETS_DIRECTORY/wheel.cdx.json" | cut -d' ' -f1
          )"
          image_sbom_digest="$(
            sha256sum "$RELEASE_ASSETS_DIRECTORY/runtime-image.cdx.json" | cut -d' ' -f1
          )"
          jq -nS \
            --arg image_digest "$normalized_digest" \
            --arg image_name "$IMAGE_NAME" \
            --arg image_sbom_digest "$image_sbom_digest" \
            --arg repository "$REPOSITORY_URL" \
            --arg revision "$SOURCE_REVISION" \
            --arg uv_lock_digest "$lock_digest" \
            --arg wheel_digest "$wheel_digest" \
            --arg wheel_sbom_digest "$wheel_sbom_digest" \
            '{
              "_type": "https://in-toto.io/Statement/v1",
              "predicateType": "https://slsa.dev/provenance/v1",
              "subject": [
                {
                  "name": "schemabridge-0.1.0-py3-none-any.whl",
                  "digest": {"sha256": $wheel_digest}
                },
                {
                  "name": $image_name,
                  "digest": {"sha256": $image_digest}
                }
              ],
              "predicate": {
                "buildDefinition": {
                  "buildType": "https://github.com/SchemaBridge/buildtypes/github-actions-frozen-uv/v1",
                  "externalParameters": {
                    "repository": $repository,
                    "revision": $revision,
                    "workflow": ".github/workflows/release-evidence.yml"
                  },
                  "internalParameters": {
                    "runtimeExtras": ["api", "postgres", "sql", "ui"],
                    "uvVersion": "0.11.30"
                  },
                  "resolvedDependencies": [
                    {
                      "uri": ("git+" + $repository + "@" + $revision),
                      "digest": {"gitCommit": $revision}
                    },
                    {"uri": "uv.lock", "digest": {"sha256": $uv_lock_digest}},
                    {
                      "uri": "wheel.cdx.json",
                      "digest": {"sha256": $wheel_sbom_digest}
                    },
                    {
                      "uri": "runtime-image.cdx.json",
                      "digest": {"sha256": $image_sbom_digest}
                    }
                  ]
                },
                "runDetails": {
                  "builder": {
                    "id": "https://github.com/actions/runner"
                  },
                  "metadata": {
                    "invocationId": (
                      $repository
                      + "/actions/workflows/.github/workflows/release-evidence.yml@"
                      + $revision
                    )
                  }
                }
              }
            }' > "$RELEASE_ASSETS_DIRECTORY/provenance.intoto.json"
          printf '%s\n\n%s\n%s\n%s\n' \
            "# SchemaBridge $RELEASE_TAG" \
            "- Source: \`$SOURCE_REVISION\`" \
            "- Image: \`$IMAGE_NAME@$IMAGE_DIGEST\`" \
            "- Checksums: \`release-assets.sha256\`" \
            > "$RELEASE_ASSETS_DIRECTORY/release-body.md"
          release_body_digest="$(
            sha256sum "$RELEASE_ASSETS_DIRECTORY/release-body.md" | cut -d' ' -f1
          )"
          pip_audit_evidence="$(
            jq -ce '
              .scanner_evidence.pip_audit
              | select(
                  .tool == "pip-audit"
                  and .tool_version == "2.10.1"
                  and .service == "pypi"
                  and .source == "https://pypi.org/pypi"
                  and (
                    .observed_at
                    | type == "string"
                      and test(
                        "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                      )
                  )
                )
            ' "$manifest"
          )"
          trivy_evidence="$(
            jq -ce '
              select(
                .action == "aquasecurity/trivy-action"
                and .action_revision == "ed142fd0673e97e23eac54620cfb913e5ce36c25"
                and .tool == "trivy"
                and .tool_version == "0.69.3"
                and (
                  .observed_at
                  | type == "string"
                    and test(
                      "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                    )
                )
                and (
                  .vulnerability_database.schema_version
                  | type == "number" and . > 0
                )
                and (
                  .vulnerability_database.byte_size
                  | type == "number" and . > 0 and . <= 1073741824
                )
                and (
                  .vulnerability_database.sha256
                  | test("^[0-9a-f]{64}$")
                )
                and (
                  .vulnerability_database.metadata_sha256
                  | test("^[0-9a-f]{64}$")
                )
                and all(
                  .vulnerability_database.updated_at,
                  .vulnerability_database.next_update,
                  .vulnerability_database.downloaded_at;
                  type == "string"
                  and test(
                    "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?Z$"
                  )
                )
              )
            ' "$RAW_EVIDENCE_DIRECTORY/scanner-evidence.json"
          )"
          jq -nS \
            --arg format_version "2" \
            --arg image_config_digest "$LOCAL_IMAGE_ID" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_name "$IMAGE_NAME" \
            --arg release_body_sha256 "$release_body_digest" \
            --arg release_tag "$RELEASE_TAG" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_revision "$SOURCE_REVISION" \
            --argjson pip_audit_evidence "$pip_audit_evidence" \
            --argjson trivy_evidence "$trivy_evidence" \
            '{
              format_version: $format_version,
              image_config_digest: $image_config_digest,
              image_digest: $image_digest,
              image_name: $image_name,
              release_body_sha256: $release_body_sha256,
              release_tag: $release_tag,
              repository: $repository,
              scanner_evidence: {
                pip_audit: $pip_audit_evidence,
                trivy: $trivy_evidence
              },
              source_ref: $source_ref,
              source_revision: $source_revision
            }' > "$RELEASE_ASSETS_DIRECTORY/release-metadata.json"
          (
            cd "$RELEASE_ASSETS_DIRECTORY"
            sha256sum \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-body.md \
              release-metadata.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json > release-assets.sha256
          )
          cp "$RELEASE_ASSETS_DIRECTORY/"* "$RELEASE_PAYLOAD_DIRECTORY/"
          jq -nS \
            --arg body_sha256 "$(
              sha256sum "$RELEASE_PAYLOAD_DIRECTORY/release-body.md" | cut -d' ' -f1
            )" \
            --arg candidate_tag "$CANDIDATE_TAG" \
            --arg format_version "2" \
            --arg image_config_digest "$LOCAL_IMAGE_ID" \
            --arg image_digest "$IMAGE_DIGEST" \
            --arg image_name "$IMAGE_NAME" \
            --arg release_tag "$RELEASE_TAG" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_revision "$SOURCE_REVISION" \
            '{
              body_sha256: $body_sha256,
              candidate_tag: $candidate_tag,
              format_version: $format_version,
              image_config_digest: $image_config_digest,
              image_digest: $image_digest,
              image_name: $image_name,
              release_tag: $release_tag,
              repository: $repository,
              source_ref: $source_ref,
              source_revision: $source_revision
            }' > "$RELEASE_PAYLOAD_DIRECTORY/release-payload.json"
          (
            cd "$RELEASE_PAYLOAD_DIRECTORY"
            sha256sum \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              release-payload.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json > SHA256SUMS
          )
          expected_entries="$(
            printf '%s\n' \
              SHA256SUMS \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              release-payload.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json | sort
          )"
          actual_entries="$(
            find "$RELEASE_PAYLOAD_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )"
          test "$actual_entries" = "$expected_entries"
      - name: Upload the immutable canonical release payload
        id: upload_release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/release-payload/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 35
          compression-level: 0

  attest:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production-release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      ARTIFACT_DIGEST: ${{ needs.scan.outputs.artifact-digest }}
      ARTIFACT_ID: ${{ needs.scan.outputs.artifact-id }}
      ARTIFACT_NAME: ${{ needs.scan.outputs.artifact-name }}
      CANDIDATE_TAG: ${{ needs.scan.outputs.candidate-tag }}
      IMAGE_DIGEST: ${{ needs.scan.outputs.image-digest }}
      IMAGE_ID: ${{ needs.scan.outputs.image-id }}
      IMAGE_NAME: ${{ needs.scan.outputs.image-name }}
      RELEASE_PAYLOAD_DIRECTORY: .local/release-payload
    steps:
      - name: Verify canonical payload and release boundary before first attestation mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_authoritative_release_controls() {
            local active_rulesets=0
            local immutable_releases
            local ruleset_ids
            local ruleset
            local ruleset_id
            [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
            local audit_repository
            audit_repository="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY"
            )"
            test "$(jq -r '.permissions.push == true' <<<"$audit_repository")" = "true"
            ruleset_ids="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -cer '[.[][] | .id] as $ids
                  | select(
                      length == ($ids | unique | length)
                      and all(type == "number" and . > 0)
                    )
                  | sort'
            )"
            while IFS= read -r ruleset_id; do
              test -n "$ruleset_id"
              ruleset="$(
                GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                  gh api --method GET \
                    --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                    "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
              )"
              if [[ "$(jq -r '.enforcement' <<<"$ruleset")" = "active" ]]; then
                active_rulesets=$((active_rulesets + 1))
                test "$(
                  jq -r '
                    .target == "tag"
                    and .enforcement == "active"
                    and has("bypass_actors")
                    and (.bypass_actors | type == "array" and length == 0)
                    and .conditions.ref_name.include == ["refs/tags/v*"]
                    and .conditions.ref_name.exclude == []
                    and ([.rules[].type] | sort)
                      == ["deletion", "non_fast_forward", "update"]
                  ' <<<"$ruleset"
                )" = "true"
              fi
            done < <(jq -r '.[]' <<<"$ruleset_ids")
            test "$active_rulesets" = "1"
            immutable_releases="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/immutable-releases"
            )"
            test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ARTIFACT_NAME"
          artifact_payload="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          )"
