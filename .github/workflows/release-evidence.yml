          subject-path: .local/release-payload/schemabridge-0.1.0-py3-none-any.whl
      - name: Create GitHub-hosted evidence attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
