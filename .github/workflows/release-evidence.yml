                  raise SystemExit("ZIP uncompressed-size limit exceeded")
              corrupt = payload.testzip()
              if corrupt is not None:
                  raise SystemExit(f"ZIP CRC mismatch: {corrupt!r}")
          PY
          test ! -e "$PREPARED_DIRECTORY"
          mkdir -p "$PREPARED_DIRECTORY"
          unzip -q "$archive_path" -d "$PREPARED_DIRECTORY"
          test -z "$(
            find "$PREPARED_DIRECTORY" -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          expected_entries="$(
            printf '%s\n' \
              SHA256SUMS \
              direct-licenses.json \
              pip-audit.json \
              prepared-manifest.json \
              provenance.intoto.json \
              runtime-image.cdx.json \
              runtime-image.tar \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json | sort
          )"
          actual_entries="$(
            find "$PREPARED_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )"
          test "$actual_entries" = "$expected_entries"
          verify_checksum_manifest_exact() {
            local checksum_file="$1"
            local checksum_line
            local checksum_name
            local expected_name
            local -A expected_names=()
            local -A observed_names=()
            shift
            test "$#" -gt 0
            test "$(stat --format='%s' "$checksum_file")" -le 4096
            for expected_name in "$@"; do
              [[ "$expected_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
              test -z "${expected_names[$expected_name]+present}"
              expected_names["$expected_name"]=1
            done
            test "$(wc -l < "$checksum_file" | tr -d ' ')" = "${#expected_names[@]}"
            while IFS= read -r checksum_line; do
              [[ "$checksum_line" =~ ^([0-9a-f]{64})\ \ ([A-Za-z0-9][A-Za-z0-9._-]*)$ ]]
              checksum_name="${BASH_REMATCH[2]}"
              test -n "${expected_names[$checksum_name]+present}"
              test -z "${observed_names[$checksum_name]+present}"
              observed_names["$checksum_name"]=1
            done < "$checksum_file"
            test "${#observed_names[@]}" = "${#expected_names[@]}"
          }
          verify_checksum_manifest_exact "$PREPARED_DIRECTORY/SHA256SUMS" \
            direct-licenses.json \
            pip-audit.json \
            prepared-manifest.json \
            provenance.intoto.json \
            runtime-image.cdx.json \
            runtime-image.tar \
            schemabridge-0.1.0-py3-none-any.whl \
            trivy-image.json \
            wheel.cdx.json
