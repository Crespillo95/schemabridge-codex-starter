          test "$(jq -r '.format_version' "$manifest")" = "2"
          test "$(jq -r '.repository' "$manifest")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.release_tag' "$manifest")" = "$RELEASE_TAG"
          test "$(jq -r '.source_ref' "$manifest")" = "$SOURCE_REF"
          test "$(jq -r '.source_revision' "$manifest")" = "$SOURCE_REVISION"
          test "$(jq -r '.local_image_name' "$manifest")" = "schemabridge-runtime:$SOURCE_REVISION"
          canonical_semver "$RELEASE_TAG"
          [[ "$RELEASE_TAG" != *-* ]]
          test "$RELEASE_TAG" = "v$(jq -r '.project_version' "$manifest")"
          image_id="$(jq -er '.image_id | select(test("^sha256:[0-9a-f]{64}$"))' "$manifest")"
          docker image load --input "$PREPARED_DIRECTORY/runtime-image.tar"
          test "$(docker image inspect --format '{{.Id}}' "schemabridge-runtime:$SOURCE_REVISION")" = "$image_id"
          test "$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "schemabridge-runtime:$SOURCE_REVISION"
          )" = "$SOURCE_REVISION"
          test "$(
            GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
              gh api --method GET --paginate --slurp \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
                jq -c --arg tag "$RELEASE_TAG" \
                  '[.[][] | select(.tag_name == $tag)] | length'
          )" = "0"
          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          verify_default_head
          verify_authoritative_release_controls
          printf 'image-id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Validate protected environment sentinel before first mutation
        shell: bash
        env:
          RELEASE_APPROVAL_SENTINEL: ${{ secrets.SCHEMABRIDGE_RELEASE_APPROVAL_SENTINEL }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_APPROVAL_SENTINEL" =~ ^[A-Za-z0-9._-]{32,128}$ ]]
      - name: Resolve the canonical GHCR image name
        id: image_name
        shell: bash
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_SLUG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]
          printf 'name=ghcr.io/%s\n' "${REPOSITORY_SLUG,,}" >> "$GITHUB_OUTPUT"
      - name: Publish the new stable semantic candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ steps.image_name.outputs.name }}
          LOCAL_IMAGE_ID: ${{ steps.prepared.outputs.image-id }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          registry_path="${IMAGE_NAME#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error \
              --user "$REGISTRY_ACTOR:$GH_TOKEN" \
              --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:$registry_path:pull,push" \
              https://ghcr.io/token |
              jq -er '.token | select(type == "string" and length > 0)'
          )"
          printf '%s' "$registry_token" |
            docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          inspect_manifest() {
            local reference="$1"
            local body
            local code
            local config_digest
            local digest
            local header_digest
            local headers
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(
              curl --silent --show-error \
                --max-filesize 4194304 \
                --output "$body" \
                --dump-header "$headers" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/$registry_path/manifests/$reference"
            )"
            test "$(stat --format='%s' "$body")" -le 4194304
            if [[ "$code" = "404" ]]; then
              jq -e '.errors | length > 0 and all(
                .code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN"
              )' "$body" >/dev/null
              return 4
            fi
            test "$code" = "200"
            digest="sha256:$(sha256sum "$body" | cut -d' ' -f1)"
            header_digest="$(
              awk 'tolower($1) == "docker-content-digest:" {print $2}' "$headers" |
                tr -d '\r' |
                tail -1
            )"
            test "$header_digest" = "$digest"
            config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$body")"
            printf '%s|%s\n' "$digest" "$config_digest"
          }
          candidate_reference="$IMAGE_NAME:$CANDIDATE_TAG"
          if inspect_manifest "$RELEASE_TAG" >/dev/null; then
            printf '%s\n' "stable tag already exists; dispatch is not clean" >&2
            exit 1
          else
            test "$?" = "4"
          fi
          if candidate_state="$(inspect_manifest "$CANDIDATE_TAG")"; then
            candidate_digest="${candidate_state%%|*}"
            test "${candidate_state##*|}" = "$LOCAL_IMAGE_ID"
            printf '%s\n' "adopting the exact candidate created by this run after a retry"
            printf 'digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"
            printf 'tag=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          else
            test "$?" = "4"
          fi
          docker image tag "schemabridge-runtime:$SOURCE_REVISION" "$candidate_reference"
          push_output="$(docker image push "$candidate_reference" 2>&1)"
          printf '%s\n' "$push_output"
          pushed_digest="$(
            sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' <<<"$push_output" | tail -1
          )"
          [[ "$pushed_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          candidate_state="$(inspect_manifest "$CANDIDATE_TAG")"
          candidate_digest="${candidate_state%%|*}"
          test "$candidate_digest" = "$pushed_digest"
          test "${candidate_state##*|}" = "$LOCAL_IMAGE_ID"
          printf 'digest=%s\n' "$candidate_digest" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

  scan:
    needs:
      - prepare
