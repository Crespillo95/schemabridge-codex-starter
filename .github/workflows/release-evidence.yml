            .local/release-payload/pip-audit.json
            .local/release-payload/provenance.intoto.json
            .local/release-payload/release-assets.sha256
            .local/release-payload/release-body.md
            .local/release-payload/release-metadata.json
            .local/release-payload/runtime-image.cdx.json
            .local/release-payload/trivy-image.json
            .local/release-payload/wheel.cdx.json
      - name: Publish the runtime-image provenance attestation to GHCR
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
