              test -z "${expected_names[$expected_name]+present}"
              expected_names["$expected_name"]=1
            done
            test "$(wc -l < "$checksum_file" | tr -d ' ')" = "${#expected_names[@]}"
            while IFS= read -r checksum_line; do
              [[ "$checksum_line" =~ ^([0-9a-f]{64})\ \ ([A-Za-z0-9][A-Za-z0-9._-]*)$ ]]
              checksum_name="${BASH_REMATCH[2]}"
              test -n "${expected_names[$checksum_name]+present}"
              test -z "${observed_names[$checksum_name]+present}"
