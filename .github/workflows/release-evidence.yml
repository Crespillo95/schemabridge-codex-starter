      ARTIFACT_ID: ${{ needs.scan.outputs.artifact-id }}
      ARTIFACT_NAME: ${{ needs.scan.outputs.artifact-name }}
      CANDIDATE_TAG: ${{ needs.scan.outputs.candidate-tag }}
      IMAGE_DIGEST: ${{ needs.scan.outputs.image-digest }}
      IMAGE_ID: ${{ needs.scan.outputs.image-id }}
      IMAGE_NAME: ${{ needs.scan.outputs.image-name }}
      RELEASE_PAYLOAD_DIRECTORY: .local/release-payload
