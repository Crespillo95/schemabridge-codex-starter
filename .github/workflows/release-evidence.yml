name: Release evidence

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated canonical SemVer tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: schemabridge-global-release-publication
  queue: max
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: "1"
  GH_API_VERSION: "2026-03-10"
  NO_COLOR: "1"
  RELEASE_TAG: ${{ inputs.release_tag }}
  REPOSITORY_URL: https://github.com/${{ github.repository }}
  SOURCE_REF: ${{ github.ref }}
  SOURCE_REVISION: ${{ github.sha }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production-release
    permissions:
      attestations: read
      contents: read
      packages: read
    outputs:
      published-noop: ${{ steps.preflight.outputs.published-noop }}
    steps:
      - name: Verify authoritative clean external state before any build
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_APPROVAL_SENTINEL: ${{ secrets.SCHEMABRIDGE_RELEASE_APPROVAL_SENTINEL }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$SOURCE_REF" = "refs/tags/$RELEASE_TAG"
          [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
          [[ "$RELEASE_APPROVAL_SENTINEL" =~ ^[A-Za-z0-9._-]{32,128}$ ]]
          audit_get() {
            GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "$@"
          }
          repository="$(audit_get "repos/$GITHUB_REPOSITORY")"
          test "$(jq -r '.default_branch' <<<"$repository")" = "main"
          test "$(jq -r '.permissions.push == true' <<<"$repository")" = "true"
          tag_ref="$(
            audit_get "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          )"
          test "$(jq -r '.ref' <<<"$tag_ref")" = "refs/tags/$RELEASE_TAG"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object="$(
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_ref"
          )"
          tag_payload="$(
            audit_get "repos/$GITHUB_REPOSITORY/git/tags/$tag_object"
          )"
          test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_payload")" = "$SOURCE_REVISION"
          all_releases="$(
            GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
              gh api --method GET --paginate --slurp \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -cer '[.[][]]'
          )"
          releases="$(
            jq -cer --arg tag "$RELEASE_TAG" \
              '[.[] | select(.tag_name == $tag)]' <<<"$all_releases"
          )"
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          registry_path="${image_name#ghcr.io/}"
          registry_token="$(
            curl --fail --silent --show-error \
              --user "$GITHUB_ACTOR:$GH_TOKEN" \
              --get \
              --data-urlencode "service=ghcr.io" \
              --data-urlencode "scope=repository:$registry_path:pull" \
              https://ghcr.io/token |
              jq -er '.token | select(type == "string" and length > 0)'
          )"
          inspect_manifest() {
            local reference="$1"
            local body
            local code
            local config_digest
            local digest
            local header_digest
            local headers
            body="$(mktemp)"
            headers="$(mktemp)"
            code="$(
              curl --silent --show-error \
                --max-filesize 4194304 \
                --output "$body" \
                --dump-header "$headers" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                "https://ghcr.io/v2/$registry_path/manifests/$reference"
            )"
            test "$(stat --format='%s' "$body")" -le 4194304
            if [[ "$code" = "404" ]]; then
              jq -e '.errors | length > 0 and all(
                .code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN"
              )' "$body" >/dev/null
              return 4
            fi
            test "$code" = "200"
            digest="sha256:$(sha256sum "$body" | cut -d' ' -f1)"
            header_digest="$(
              awk 'tolower($1) == "docker-content-digest:" {print $2}' "$headers" |
                tr -d '\r' |
                tail -1
            )"
            test "$header_digest" = "$digest"
            config_digest="$(
              jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "$body"
            )"
            printf '%s|%s\n' "$digest" "$config_digest"
          }
          verify_exact_published_release() {
            local asset_count
            local asset_digest
            local asset_directory
            local asset_id
            local asset_size
            local assets
            local body_digest
            local filename
            local image_state
            local metadata
            local release
            local release_id
            release="$(jq -cer 'if length == 1 then .[0] else error("release count") end' \
              <<<"$releases")"
            release_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$release")"
            release="$(audit_get "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            test "$(jq -r '.id' <<<"$release")" = "$release_id"
            test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
            test "$(jq -r '.name' <<<"$release")" = "$RELEASE_TAG"
            test "$(jq -r '.target_commitish' <<<"$release")" = "$SOURCE_REVISION"
            test "$(jq -r '.draft' <<<"$release")" = "false"
            test "$(jq -r '.prerelease' <<<"$release")" = "false"
            test "$(jq -r '.immutable' <<<"$release")" = "true"
            jq -e '.published_at
              | type == "string"
                and test(
                  "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                )' <<<"$release" >/dev/null
            assets="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" |
                jq -cer '[.[][]]'
            )"
            test "$(
              jq '([.[].name] | sort) == ([
                    "direct-licenses.json",
                    "pip-audit.json",
                    "provenance.intoto.json",
                    "release-assets.sha256",
                    "release-body.md",
                    "release-metadata.json",
                    "runtime-image.cdx.json",
                    "schemabridge-0.1.0-py3-none-any.whl",
                    "trivy-image.json",
                    "wheel.cdx.json"
                  ] | sort)
                  and ([.[].name] | length) == 10
                  and ([.[].name] | unique | length) == 10
                ' <<<"$assets"
            )" = "true"
            asset_directory="$(mktemp -d)"
            for filename in \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json
            do
              asset_count="$(
                jq --arg name "$filename" '[.[] | select(.name == $name)] | length' \
                  <<<"$assets"
              )"
              test "$asset_count" = "1"
              asset_id="$(
                jq -er --arg name "$filename" '
                  .[] | select(.name == $name) | .id
                  | select(type == "number" and . > 0)
                ' <<<"$assets"
              )"
              asset_digest="$(
                jq -er --arg name "$filename" '
                  .[] | select(.name == $name) | .digest
                  | select(test("^sha256:[0-9a-f]{64}$"))
                ' <<<"$assets"
              )"
              asset_size="$(
                jq -er --arg name "$filename" '
                  .[] | select(.name == $name) | .size
                  | select(type == "number" and . > 0 and . <= 1073741824)
                ' <<<"$assets"
              )"
              case "$filename" in
                release-assets.sha256)
                  maximum_size=4096
                  ;;
                release-body.md | release-metadata.json)
                  maximum_size=65536
                  ;;
                provenance.intoto.json)
                  maximum_size=1048576
                  ;;
                schemabridge-0.1.0-py3-none-any.whl)
                  maximum_size=67108864
                  ;;
                direct-licenses.json | pip-audit.json | runtime-image.cdx.json | \
                  trivy-image.json | wheel.cdx.json)
                  maximum_size=104857600
                  ;;
                *)
                  exit 1
                  ;;
              esac
              test "$asset_size" -le "$maximum_size"
              test "$(
                jq -r --arg name "$filename" \
                  '.[] | select(.name == $name) | .state' <<<"$assets"
              )" = "uploaded"
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  --header "Accept: application/octet-stream" \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                  > "$asset_directory/$filename"
              test "$(stat --format='%s' "$asset_directory/$filename")" = "$asset_size"
              test "sha256:$(
                sha256sum "$asset_directory/$filename" | cut -d' ' -f1
              )" = "$asset_digest"
            done
            for filename in \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json
            do
              gh attestation verify "$asset_directory/$filename" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
                --source-digest "$SOURCE_REVISION" \
                --source-ref "$SOURCE_REF" \
                --deny-self-hosted-runners
            done
            checksum_file="$asset_directory/release-assets.sha256"
            test "$(wc -l < "$checksum_file" | tr -d ' ')" = "9"
            declare -A checksum_names=()
            while IFS= read -r checksum_line; do
              [[ "$checksum_line" =~ ^([0-9a-f]{64})\ \ ([A-Za-z0-9][A-Za-z0-9._-]*)$ ]]
              checksum_name="${BASH_REMATCH[2]}"
              case "$checksum_name" in
                direct-licenses.json | pip-audit.json | provenance.intoto.json | \
                  release-body.md | release-metadata.json | runtime-image.cdx.json | \
                  schemabridge-0.1.0-py3-none-any.whl | trivy-image.json | wheel.cdx.json)
                  ;;
                *)
                  exit 1
                  ;;
              esac
              test -z "${checksum_names[$checksum_name]+present}"
              checksum_names["$checksum_name"]=1
            done < "$checksum_file"
            test "${#checksum_names[@]}" = "9"
            (
              cd "$asset_directory"
              sha256sum --strict --check release-assets.sha256
            )
            metadata="$asset_directory/release-metadata.json"
            test "$(jq -r '.format_version' "$metadata")" = "2"
            test "$(jq -r '.repository' "$metadata")" = "$GITHUB_REPOSITORY"
            test "$(jq -r '.release_tag' "$metadata")" = "$RELEASE_TAG"
            test "$(jq -r '.source_ref' "$metadata")" = "$SOURCE_REF"
            test "$(jq -r '.source_revision' "$metadata")" = "$SOURCE_REVISION"
            test "$(jq -r '.image_name' "$metadata")" = "$image_name"
            test "$(
              jq -r '
                .scanner_evidence.pip_audit.tool == "pip-audit"
                and .scanner_evidence.pip_audit.tool_version == "2.10.1"
                and .scanner_evidence.pip_audit.service == "pypi"
                and .scanner_evidence.pip_audit.source == "https://pypi.org/pypi"
                and (
                  .scanner_evidence.pip_audit.observed_at
                  | type == "string"
                    and test(
                      "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                    )
                )
                and .scanner_evidence.trivy.action == "aquasecurity/trivy-action"
                and .scanner_evidence.trivy.action_revision
                  == "ed142fd0673e97e23eac54620cfb913e5ce36c25"
                and .scanner_evidence.trivy.tool == "trivy"
                and .scanner_evidence.trivy.tool_version == "0.69.3"
                and (
                  .scanner_evidence.trivy.observed_at
                  | type == "string"
                    and test(
                      "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                    )
                )
                and (
                  .scanner_evidence.trivy.vulnerability_database.schema_version
                  | type == "number" and . > 0
                )
                and (
                  .scanner_evidence.trivy.vulnerability_database.byte_size
                  | type == "number" and . > 0 and . <= 1073741824
                )
                and (
                  .scanner_evidence.trivy.vulnerability_database.sha256
                  | test("^[0-9a-f]{64}$")
                )
                and (
                  .scanner_evidence.trivy.vulnerability_database.metadata_sha256
                  | test("^[0-9a-f]{64}$")
                )
              ' "$metadata"
            )" = "true"
            body_digest="$(
              sha256sum "$asset_directory/release-body.md" | cut -d' ' -f1
            )"
            test "$(jq -r '.release_body_sha256' "$metadata")" = "$body_digest"
            test "$(
              jq -jr '.body' <<<"$release" | sha256sum | cut -d' ' -f1
            )" = "$body_digest"
            expected_image_digest="$(
              jq -er '.image_digest | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata"
            )"
            expected_config_digest="$(
              jq -er '.image_config_digest
                | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata"
            )"
            gh attestation verify "oci://$image_name@$expected_image_digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-evidence.yml" \
              --source-digest "$SOURCE_REVISION" \
              --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners \
              --bundle-from-oci
            image_state="$(inspect_manifest "$RELEASE_TAG")"
            test "${image_state%%|*}" = "$expected_image_digest"
            test "${image_state##*|}" = "$expected_config_digest"
          }
          release_count="$(jq -er 'length' <<<"$releases")"
          test "$release_count" = "0" || test "$release_count" = "1"
          if [[ "$release_count" = "1" ]]; then
            verify_exact_published_release
            printf 'published-noop=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          canonical_stable_semver() {
            [[ "$1" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          }
          semver_greater() {
            local left="${1#v}"
            local right="${2#v}"
            local index
            local -a left_parts=()
            local -a right_parts=()
            IFS='.' read -r -a left_parts <<< "$left"
            IFS='.' read -r -a right_parts <<< "$right"
            for index in 0 1 2; do
              if ((${#left_parts[$index]} > ${#right_parts[$index]})); then
                return 0
              fi
              if ((${#left_parts[$index]} < ${#right_parts[$index]})); then
                return 1
              fi
              if [[ "${left_parts[$index]}" > "${right_parts[$index]}" ]]; then
                return 0
              fi
              if [[ "${left_parts[$index]}" < "${right_parts[$index]}" ]]; then
                return 1
              fi
            done
            return 1
          }
          test "$(
            jq -r '[.[] | select(.draft == true)] | length == 0' <<<"$all_releases"
          )" = "true"
          while IFS= read -r published_tag; do
            test -n "$published_tag"
            canonical_stable_semver "$published_tag"
            if semver_greater "$published_tag" "$RELEASE_TAG"; then
              printf '%s\n' "a newer stable release already exists" >&2
              exit 1
            fi
          done < <(
            jq -r '.[] | select(
              .draft == false
              and .prerelease == false
              and (.tag_name | startswith("v"))
            ) | .tag_name' <<<"$all_releases"
          )
          registry_tags_file="$(mktemp)"
          registry_tags_url="https://ghcr.io/v2/$registry_path/tags/list?n=100"
          registry_page=0
          declare -A registry_pages=()
          while [[ -n "$registry_tags_url" ]]; do
            test -z "${registry_pages[$registry_tags_url]+present}"
            registry_pages["$registry_tags_url"]=1
            registry_page=$((registry_page + 1))
            test "$registry_page" -le 1000
            registry_tags_body="$(mktemp)"
            registry_tags_headers="$(mktemp)"
            registry_tags_code="$(
              curl --silent --show-error \
                --max-filesize 4194304 \
                --output "$registry_tags_body" \
                --dump-header "$registry_tags_headers" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/json" \
                "$registry_tags_url"
            )"
            test "$(stat --format='%s' "$registry_tags_body")" -le 4194304
            test "$(stat --format='%s' "$registry_tags_headers")" -le 65536
            if [[ "$registry_tags_code" = "404" ]]; then
              test "$registry_page" = "1"
              jq -e '.errors | length > 0 and all(.code == "NAME_UNKNOWN")' \
                "$registry_tags_body" >/dev/null
              break
            fi
            test "$registry_tags_code" = "200"
            test "$(
              jq -r --arg name "$registry_path" '
                .name == $name
                and (
                  .tags == null
                  or (
                    .tags
                    | type == "array"
                      and length <= 100
                      and all(
                        type == "string"
                        and length > 0
                        and length <= 256
                      )
                  )
                )
              ' "$registry_tags_body"
            )" = "true"
            jq -r '.tags[]?' "$registry_tags_body" >> "$registry_tags_file"
            test "$(wc -l < "$registry_tags_file" | tr -d ' ')" -le 100000
            registry_tags_url="$(
              python3 - "$registry_tags_headers" "$registry_path" <<'PY'
          import re
          import sys
          from urllib.parse import parse_qs, urljoin, urlsplit

          headers_path, registry_path = sys.argv[1:]
          with open(headers_path, encoding="utf-8") as stream:
              links = [
                  line.split(":", 1)[1].strip()
                  for line in stream
                  if line.lower().startswith("link:")
              ]
          if not links:
              raise SystemExit(0)
          if len(links) != 1:
              raise SystemExit("ambiguous registry pagination")
          match = re.fullmatch(r'<([^<>]+)>;\s*rel="next"', links[0])
          if match is None:
              raise SystemExit("invalid registry next link")
          url = urljoin("https://ghcr.io", match.group(1))
          parsed = urlsplit(url)
          expected_path = f"/v2/{registry_path}/tags/list"
          query = parse_qs(parsed.query, keep_blank_values=True, strict_parsing=True)
          if (
              parsed.scheme != "https"
              or parsed.netloc != "ghcr.io"
              or parsed.path != expected_path
              or parsed.fragment
              or set(query) != {"last", "n"}
              or query["n"] != ["100"]
              or len(query["last"]) != 1
              or not 0 < len(query["last"][0]) <= 256
          ):
              raise SystemExit("unsafe registry next link")
          print(url)
          PY
            )"
          done
          test "$(
            sort "$registry_tags_file" | uniq -d | wc -l | tr -d ' '
          )" = "0"
          while IFS= read -r registry_tag; do
            if canonical_stable_semver "$registry_tag" &&
                semver_greater "$registry_tag" "$RELEASE_TAG"; then
              printf '%s\n' "a newer stable registry tag already exists" >&2
              exit 1
            fi
          done < "$registry_tags_file"
          default_ref="$(
            audit_get "repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          )"
          test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
          test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
          branch_payload="$(audit_get "repos/$GITHUB_REPOSITORY/branches/main")"
          test "$(jq -r '.name' <<<"$branch_payload")" = "main"
          test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
          test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          ruleset_ids="$(
            GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
              gh api --method GET --paginate --slurp \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
              jq -cer '[.[][] | select(.enforcement == "active") | .id]
                | select(
                    length == 1
                    and .[0] != null
                    and (.[0] | type == "number" and . > 0)
                  )'
          )"
          ruleset_id="$(jq -er '.[0]' <<<"$ruleset_ids")"
          ruleset="$(
            audit_get \
              "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
          )"
          test "$(
            jq -r '
              .target == "tag"
              and .enforcement == "active"
              and has("bypass_actors")
              and (.bypass_actors | type == "array" and length == 0)
              and .conditions.ref_name.include == ["refs/tags/v*"]
              and .conditions.ref_name.exclude == []
              and ([.rules[].type] | sort)
                == ["deletion", "non_fast_forward", "update"]
            ' <<<"$ruleset"
          )" = "true"
          immutable_releases="$(audit_get "repos/$GITHUB_REPOSITORY/immutable-releases")"
          test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          for reference in "candidate-$SOURCE_REVISION" "$RELEASE_TAG"; do
            if inspect_manifest "$reference" >/dev/null; then
              printf '%s\n' "registry reference already exists before this dispatch" >&2
              exit 1
            else
              test "$?" = "4"
            fi
          done
          printf 'published-noop=false\n' >> "$GITHUB_OUTPUT"

  prepare:
    needs: audit
    if: needs.audit.outputs.published-noop != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      artifact-digest: ${{ steps.upload_prepared.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload_prepared.outputs.artifact-id }}
      artifact-name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      LOCAL_IMAGE_NAME: schemabridge-runtime:${{ github.sha }}
      PREPARATION_DIRECTORY: .local/prepublication
      PREPARED_DIRECTORY: .local/prepared-release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify canonical release source and protected policies
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          canonical_semver() {
            local version="$1"
            local prerelease
            local identifier
            local -a identifiers=()
            if [[ ${#version} -gt 128 \
              || ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              return 1
            fi
            if [[ "$version" != *-* ]]; then
              return 0
            fi
            prerelease="${version#*-}"
            IFS='.' read -r -a identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                return 1
              fi
            done
          }
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_tag_ruleset_metadata() {
            local active_rulesets=0
            local ruleset_ids
            local ruleset
            local ruleset_id
            ruleset_ids="$(
              gh api --method GET --paginate --slurp \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -cer '[.[][] | .id] as $ids
                  | select(
                      length == ($ids | unique | length)
                      and all(type == "number" and . > 0)
                    )
                  | sort'
            )"
            while IFS= read -r ruleset_id; do
              test -n "$ruleset_id"
              ruleset="$(
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
              )"
              if [[ "$(jq -r '.enforcement' <<<"$ruleset")" = "active" ]]; then
                active_rulesets=$((active_rulesets + 1))
                test "$(jq -r '.target' <<<"$ruleset")" = "tag"
                test "$(
                  jq -r '.conditions.ref_name.include == ["refs/tags/v*"]
                    and .conditions.ref_name.exclude == []' <<<"$ruleset"
                )" = "true"
                test "$(
                  jq -r '([.rules[].type] | sort)
                    == ["deletion", "non_fast_forward", "update"]' <<<"$ruleset"
                )" = "true"
              fi
            done < <(jq -r '.[]' <<<"$ruleset_ids")
            test "$active_rulesets" = "1"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          verify_public_external_state_metadata() {
            local body
            local code
            local image_name
            local reference
            local registry_path
            local registry_token
            test "$(
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
                jq -c --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)] | length'
            )" = "0"
            image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
            registry_path="${image_name#ghcr.io/}"
            registry_token="$(
              curl --fail --silent --show-error \
                --user "$GITHUB_ACTOR:$GH_TOKEN" \
                --get \
                --data-urlencode "service=ghcr.io" \
                --data-urlencode "scope=repository:$registry_path:pull" \
                https://ghcr.io/token |
                jq -er '.token | select(type == "string" and length > 0)'
            )"
            for reference in "candidate-$SOURCE_REVISION" "$RELEASE_TAG"; do
              body="$(mktemp)"
              code="$(
                curl --silent --show-error \
                  --max-filesize 4194304 \
                  --output "$body" \
                  --write-out '%{http_code}' \
                  --header "Authorization: Bearer $registry_token" \
                  --header "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
                  "https://ghcr.io/v2/$registry_path/manifests/$reference"
              )"
              test "$(stat --format='%s' "$body")" -le 4194304
              test "$code" = "404"
              jq -e '.errors | length > 0 and all(
                .code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN"
              )' "$body" >/dev/null
            done
          }
          test "$REF_TYPE" = "tag"
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          canonical_semver "$RELEASE_TAG"
          [[ "$RELEASE_TAG" != *-* ]]
          test "$SOURCE_REF" = "refs/tags/$RELEASE_TAG"
          test "$(remote_tag_commit)" = "$SOURCE_REVISION"
          git fetch --force origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_REVISION"
          test "$(git rev-parse origin/main)" = "$SOURCE_REVISION"
          project_version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          test "$RELEASE_TAG" = "v$project_version"
          verify_default_head
          verify_tag_ruleset_metadata
          verify_public_external_state_metadata
          branch_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/branches/main")"
          test "$(jq -r 'select(.name == "main" and .protected == true) | .protected' <<<"$branch_payload")" = "true"
          test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          branch_rules="$(
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" |
              jq -c '[.[][]]'
          )"
          required_contexts="$(
            {
              jq -r '.protection.required_status_checks.contexts[]?,
                .protection.required_status_checks.checks[]?.context' <<<"$branch_payload"
              jq -r '.[] | select(.type == "required_status_checks")
                | .parameters.required_status_checks[]?.context' <<<"$branch_rules"
            } | sort -u
          )"
          for required_context in quality postgres-integration supply-chain; do
            grep -Fxq "$required_context" <<<"$required_contexts"
          done
          ci_runs="$(
            gh run list \
              --workflow ci.yml \
              --branch main \
              --commit "$SOURCE_REVISION" \
              --event push \
              --limit 100 \
              --json attempt,conclusion,createdAt,databaseId,event,headBranch,headSha,status
          )"
          ci_run_id="$(
            jq -er --arg revision "$SOURCE_REVISION" '
              map(select(
                .headSha == $revision
                and .headBranch == "main"
                and .event == "push"
              ))
              | sort_by(.createdAt, .attempt)
              | last
              | select(.status == "completed" and .conclusion == "success")
              | .databaseId
              | select(type == "number" and . > 0)
            ' <<<"$ci_runs"
          )"
          required_jobs="$(
            gh run view "$ci_run_id" \
              --json jobs \
              --jq '[.jobs[] | select(
                .name == "quality"
                or .name == "postgres-integration"
                or .name == "supply-chain"
              )] | "\(. | length):\([.[].name] | unique | length):\([
                .[] | select(.status == "completed" and .conclusion == "success")
              ] | length)"'
          )"
          test "$required_jobs" = "3:3:3"
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: "0.11.30"
          enable-cache: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install and verify frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          make bootstrap
          make supply-chain-static
          .venv/bin/python scripts/release_audit.py --require-release
      - name: Build the wheel once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREPARATION_DIRECTORY/dist"
          .venv/bin/uv build --wheel --no-build-isolation --no-create-gitignore \
            --out-dir "$PREPARATION_DIRECTORY/dist"
      - name: Build the unpublished runtime image once
        id: local_build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          SOURCE_DATE_EPOCH: "1730470033"
        with:
          context: .
          file: Dockerfile.runtime
          build-args: |
            SCHEMABRIDGE_RELEASE_REF=${{ github.sha }}
          platforms: linux/amd64
          pull: true
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.LOCAL_IMAGE_NAME }}
      - name: Record the unpublished local config digest
        id: local_image
        shell: bash
        run: |
          set -euo pipefail
          image_id="$(docker image inspect --format '{{.Id}}' "$LOCAL_IMAGE_NAME")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$LOCAL_IMAGE_NAME"
          )" = "$SOURCE_REVISION"
          printf 'id=%s\n' "$image_id" >> "$GITHUB_OUTPUT"
      - name: Generate the unpublished runtime-image CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE_NAME }}
          cache-dir: .local/trivy-cache
          format: cyclonedx
          output: .local/prepublication/runtime-image.cdx.json
          version: v0.69.3
      - name: Scan the unpublished runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.LOCAL_IMAGE_NAME }}
          cache-dir: .local/trivy-cache
          scanners: vuln
          format: json
          output: .local/prepublication/trivy-image.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          list-all-pkgs: true
          exit-code: "0"
          version: v0.69.3
      - name: Audit exact Python runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip_audit_version="$(
            .venv/bin/pip-audit --version |
              sed -nE 's/^pip-audit ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p'
          )"
          test "$pip_audit_version" = "2.10.1"
          pip_audit_observed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if .venv/bin/pip-audit --disable-pip --require-hashes --format json \
              --vulnerability-service pypi \
              --output "$PREPARATION_DIRECTORY/pip-audit.json" \
              --requirement requirements/runtime.txt \
              --requirement requirements/build.txt \
              --requirement requirements/watchdog-build.txt
          then
            audit_status=0
          else
            audit_status=$?
          fi
          if [[ "$audit_status" -gt 1 ]]; then
            exit "$audit_status"
          fi
          jq -nS \
            --arg observed_at "$pip_audit_observed_at" \
            --arg source "https://pypi.org/pypi" \
            --arg tool_version "$pip_audit_version" \
            '{
              observed_at: $observed_at,
              service: "pypi",
              source: $source,
              tool: "pip-audit",
              tool_version: $tool_version
            }' > "$PREPARATION_DIRECTORY/pip-audit-observation.json"
      - name: Normalize deterministic prepublication reports
        shell: bash
        run: |
          set -euo pipefail
          jq -S 'del(.serialNumber, .metadata.timestamp)' \
            "$PREPARATION_DIRECTORY/runtime-image.cdx.json" \
            > "$PREPARATION_DIRECTORY/runtime-image.normalized.json"
          mv "$PREPARATION_DIRECTORY/runtime-image.normalized.json" \
            "$PREPARATION_DIRECTORY/runtime-image.cdx.json"
          jq -S 'del(.CreatedAt) | del(.Metadata.RepoTags)' \
            "$PREPARATION_DIRECTORY/trivy-image.json" \
            > "$PREPARATION_DIRECTORY/trivy-image.normalized.json"
          mv "$PREPARATION_DIRECTORY/trivy-image.normalized.json" \
            "$PREPARATION_DIRECTORY/trivy-image.json"
          jq -S . "$PREPARATION_DIRECTORY/pip-audit.json" \
            > "$PREPARATION_DIRECTORY/pip-audit.normalized.json"
          mv "$PREPARATION_DIRECTORY/pip-audit.normalized.json" \
            "$PREPARATION_DIRECTORY/pip-audit.json"
      - name: Block publication unless the local candidate passes every evidence gate
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find "$PREPARATION_DIRECTORY/dist" -maxdepth 1 -type f -name '*.whl')"
          test -n "$wheel_path"
          test "$(printf '%s\n' "$wheel_path" | wc -l | tr -d ' ')" = "1"
          .venv/bin/python scripts/verify_supply_chain.py generate-evidence \
            --repository "$REPOSITORY_URL" \
            --revision "$SOURCE_REVISION" \
            --wheel "$wheel_path" \
            --image-name "$LOCAL_IMAGE_NAME" \
            --image-digest "${{ steps.local_image.outputs.id }}" \
            --output-directory "$PREPARATION_DIRECTORY" \
            --workflow ".github/workflows/release-evidence.yml"
          .venv/bin/python scripts/verify_supply_chain.py vulnerabilities \
            --report "$PREPARATION_DIRECTORY/pip-audit.json" \
            --report "$PREPARATION_DIRECTORY/trivy-image.json" \
            --image-name "$LOCAL_IMAGE_NAME" \
            --image-digest "${{ steps.local_image.outputs.id }}"
          .venv/bin/python scripts/verify_supply_chain.py verify-evidence \
            --repository "$REPOSITORY_URL" \
            --revision "$SOURCE_REVISION" \
            --wheel "$wheel_path" \
            --image-name "$LOCAL_IMAGE_NAME" \
            --image-digest "${{ steps.local_image.outputs.id }}" \
            --output-directory "$PREPARATION_DIRECTORY" \
            --workflow ".github/workflows/release-evidence.yml"
      - name: Seal the semantic prepared release payload
        shell: bash
        env:
          IMAGE_ID: ${{ steps.local_image.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p "$PREPARED_DIRECTORY"
          wheel_path="$(find "$PREPARATION_DIRECTORY/dist" -maxdepth 1 -type f -name '*.whl')"
          test "$(basename "$wheel_path")" = "schemabridge-0.1.0-py3-none-any.whl"
          cp "$wheel_path" "$PREPARED_DIRECTORY/schemabridge-0.1.0-py3-none-any.whl"
          for evidence_name in \
            direct-licenses.json \
            pip-audit.json \
            provenance.intoto.json \
            runtime-image.cdx.json \
            trivy-image.json \
            wheel.cdx.json
          do
            cp "$PREPARATION_DIRECTORY/$evidence_name" "$PREPARED_DIRECTORY/$evidence_name"
          done
          docker image save --output "$PREPARED_DIRECTORY/runtime-image.tar" "$LOCAL_IMAGE_NAME"
          project_version="$(
            python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          jq -nS \
            --arg format_version "2" \
            --arg image_id "$IMAGE_ID" \
            --arg local_image_name "$LOCAL_IMAGE_NAME" \
            --arg project_version "$project_version" \
            --arg release_tag "$RELEASE_TAG" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_ref "$SOURCE_REF" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg uv_lock_sha256 "$(sha256sum uv.lock | cut -d' ' -f1)" \
            --argjson pip_audit_evidence "$(
              jq -ce '
                select(
                  .tool == "pip-audit"
                  and .tool_version == "2.10.1"
                  and .service == "pypi"
                  and .source == "https://pypi.org/pypi"
                  and (
                    .observed_at
                    | type == "string"
                      and test(
                        "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
                      )
                  )
                )
              ' "$PREPARATION_DIRECTORY/pip-audit-observation.json"
            )" \
            '{
              format_version: $format_version,
              image_id: $image_id,
              local_image_name: $local_image_name,
              project_version: $project_version,
              release_tag: $release_tag,
              repository: $repository,
              scanner_evidence: {
                pip_audit: $pip_audit_evidence
              },
              source_ref: $source_ref,
              source_revision: $source_revision,
              uv_lock_sha256: $uv_lock_sha256
            }' > "$PREPARED_DIRECTORY/prepared-manifest.json"
          (
            cd "$PREPARED_DIRECTORY"
            sha256sum \
              direct-licenses.json \
              pip-audit.json \
              prepared-manifest.json \
              provenance.intoto.json \
              runtime-image.cdx.json \
              runtime-image.tar \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json > SHA256SUMS
          )
          expected_entries="$(
            printf '%s\n' \
              SHA256SUMS \
              direct-licenses.json \
              pip-audit.json \
              prepared-manifest.json \
              provenance.intoto.json \
              runtime-image.cdx.json \
              runtime-image.tar \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json | sort
          )"
          actual_entries="$(
            find "$PREPARED_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )"
          test "$actual_entries" = "$expected_entries"
      - name: Upload the immutable prepared release artifact
        id: upload_prepared
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: prepared-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/prepared-release/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 35
          compression-level: 0

  candidate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-release
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      image-digest: ${{ steps.candidate.outputs.digest }}
      image-id: ${{ steps.prepared.outputs.image-id }}
      image-name: ${{ steps.image_name.outputs.name }}
    env:
      ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact-digest }}
      ARTIFACT_ID: ${{ needs.prepare.outputs.artifact-id }}
      ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact-name }}
      CANDIDATE_TAG: candidate-${{ github.sha }}
      PREPARED_DIRECTORY: .local/prepared-release
    steps:
      - name: Verify prepared artifact and release boundary before first package mutation
        id: prepared
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_AUDIT_TOKEN: ${{ secrets.SCHEMABRIDGE_RELEASE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          canonical_semver() {
            local version="$1"
            local prerelease
            local identifier
            local -a identifiers=()
            if [[ ${#version} -gt 128 \
              || ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              return 1
            fi
            if [[ "$version" != *-* ]]; then
              return 0
            fi
            prerelease="${version#*-}"
            IFS='.' read -r -a identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" != "0" && "$identifier" == 0* ]]; then
                return 1
              fi
            done
          }
          remote_tag_commit() {
            local ref_payload
            local tag_object
            local tag_payload
            ref_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.ref' <<<"$ref_payload")" = "refs/tags/$RELEASE_TAG"
            test "$(jq -r '.object.type' <<<"$ref_payload")" = "tag"
            tag_object="$(jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$ref_payload")"
            tag_payload="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")"
            test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
            jq -er '.object.sha | select(test("^[0-9a-f]{40}$"))' <<<"$tag_payload"
          }
          verify_authoritative_release_controls() {
            local active_rulesets=0
            local immutable_releases
            local ruleset_ids
            local ruleset
            local ruleset_id
            [[ "$RELEASE_AUDIT_TOKEN" =~ ^[^[:space:]]{40,255}$ ]]
            local audit_repository
            audit_repository="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY"
            )"
            test "$(jq -r '.permissions.push == true' <<<"$audit_repository")" = "true"
            ruleset_ids="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET --paginate --slurp \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=true&targets=tag&per_page=100" |
                jq -cer '[.[][] | .id] as $ids
                  | select(
                      length == ($ids | unique | length)
                      and all(type == "number" and . > 0)
                    )
                  | sort'
            )"
            while IFS= read -r ruleset_id; do
              test -n "$ruleset_id"
              ruleset="$(
                GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                  gh api --method GET \
                    --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                    "repos/$GITHUB_REPOSITORY/rulesets/$ruleset_id?includes_parents=true"
              )"
              if [[ "$(jq -r '.enforcement' <<<"$ruleset")" = "active" ]]; then
                active_rulesets=$((active_rulesets + 1))
                test "$(
                  jq -r '
                    .target == "tag"
                    and .enforcement == "active"
                    and has("bypass_actors")
                    and (.bypass_actors | type == "array" and length == 0)
                    and .conditions.ref_name.include == ["refs/tags/v*"]
                    and .conditions.ref_name.exclude == []
                    and ([.rules[].type] | sort)
                      == ["deletion", "non_fast_forward", "update"]
                  ' <<<"$ruleset"
                )" = "true"
              fi
            done < <(jq -r '.[]' <<<"$ruleset_ids")
            test "$active_rulesets" = "1"
            immutable_releases="$(
              GH_TOKEN="$RELEASE_AUDIT_TOKEN" \
                gh api --method GET \
                  --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                  "repos/$GITHUB_REPOSITORY/immutable-releases"
            )"
            test "$(jq -r '.enabled == true' <<<"$immutable_releases")" = "true"
          }
          verify_default_head() {
            local branch_payload
            local default_ref
            local repository
            repository="$(gh api --method GET "repos/$GITHUB_REPOSITORY")"
            test "$(jq -r '.default_branch' <<<"$repository")" = "main"
            default_ref="$(gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
            test "$(jq -r '.object.type' <<<"$default_ref")" = "commit"
            test "$(jq -r '.object.sha' <<<"$default_ref")" = "$SOURCE_REVISION"
            branch_payload="$(
              gh api --method GET \
                --header "X-GitHub-Api-Version: $GH_API_VERSION" \
                "repos/$GITHUB_REPOSITORY/branches/main"
            )"
            test "$(jq -r '.name' <<<"$branch_payload")" = "main"
            test "$(jq -r '.protected' <<<"$branch_payload")" = "true"
            test "$(jq -r '.commit.sha' <<<"$branch_payload")" = "$SOURCE_REVISION"
          }
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ARTIFACT_NAME"
          artifact_payload="$(
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
          )"
          test "$(jq -r '.id | tostring' <<<"$artifact_payload")" = "$ARTIFACT_ID"
          test "$(jq -r '.name' <<<"$artifact_payload")" = "$ARTIFACT_NAME"
          test "$(jq -r '.expired' <<<"$artifact_payload")" = "false"
          test "$(jq -r '.digest' <<<"$artifact_payload")" = "sha256:$ARTIFACT_DIGEST"
          test "$(jq -r '.workflow_run.id | tostring' <<<"$artifact_payload")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$artifact_payload")" = "$SOURCE_REVISION"
          artifact_size="$(
            jq -er '.size_in_bytes | select(type == "number" and . > 0 and . <= 1073741824)' \
              <<<"$artifact_payload"
          )"
          archive_path="$RUNNER_TEMP/prepared-release.zip"
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive_path"
          test "$(stat -c '%s' "$archive_path")" = "$artifact_size"
          test "$(sha256sum "$archive_path" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 - "$archive_path" \
            SHA256SUMS \
            direct-licenses.json \
            pip-audit.json \
            prepared-manifest.json \
            provenance.intoto.json \
            runtime-image.cdx.json \
            runtime-image.tar \
            schemabridge-0.1.0-py3-none-any.whl \
            trivy-image.json \
            wheel.cdx.json <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive, *expected = sys.argv[1:]
          expected_set = set(expected)
          if len(expected) != 10 or len(expected_set) != len(expected):
              raise SystemExit("invalid trusted ZIP allowlist")
          with zipfile.ZipFile(archive) as payload:
              entries = payload.infolist()
              names = [entry.filename for entry in entries]
              if len(entries) != len(expected) or len(set(names)) != len(names):
                  raise SystemExit("ZIP entry count or uniqueness mismatch")
              if set(names) != expected_set:
                  raise SystemExit("ZIP allowlist mismatch")
              total_size = 0
              for entry in entries:
                  name = entry.filename
                  path = PurePosixPath(name)
                  mode = (entry.external_attr >> 16) & 0xFFFF
                  file_type = stat.S_IFMT(mode)
                  if (
                      not name
                      or "\x00" in name
                      or "\\" in name
                      or path.is_absolute()
                      or len(path.parts) != 1
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or entry.is_dir()
                      or entry.flag_bits & 0x1
                      or file_type not in {0, stat.S_IFREG}
                      or entry.file_size <= 0
                      or entry.file_size > 1073741824
                      or entry.compress_size <= 0
                      or entry.file_size / entry.compress_size > 100
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {name!r}")
