          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$archive_path"
          test "$(stat -c '%s' "$archive_path")" = "$artifact_size"
          test "$(sha256sum "$archive_path" | cut -d' ' -f1)" = "$ARTIFACT_DIGEST"
          python3 - "$archive_path" \
            SHA256SUMS \
            direct-licenses.json \
            pip-audit.json \
            provenance.intoto.json \
            release-assets.sha256 \
            release-body.md \
            release-metadata.json \
            release-payload.json \
            runtime-image.cdx.json \
            schemabridge-0.1.0-py3-none-any.whl \
            trivy-image.json \
            wheel.cdx.json <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive, *expected = sys.argv[1:]
          expected_set = set(expected)
          if len(expected) != 12 or len(expected_set) != len(expected):
              raise SystemExit("invalid trusted ZIP allowlist")
          with zipfile.ZipFile(archive) as payload:
              entries = payload.infolist()
              names = [entry.filename for entry in entries]
              if len(entries) != len(expected) or len(set(names)) != len(names):
                  raise SystemExit("ZIP entry count or uniqueness mismatch")
              if set(names) != expected_set:
                  raise SystemExit("ZIP allowlist mismatch")
              total_size = 0
              for entry in entries:
                  name = entry.filename
                  path = PurePosixPath(name)
                  mode = (entry.external_attr >> 16) & 0xFFFF
                  file_type = stat.S_IFMT(mode)
                  if (
                      not name
                      or "\x00" in name
                      or "\\" in name
                      or path.is_absolute()
                      or len(path.parts) != 1
                      or any(part in {"", ".", ".."} for part in path.parts)
                      or entry.is_dir()
                      or entry.flag_bits & 0x1
                      or file_type not in {0, stat.S_IFREG}
                      or entry.file_size <= 0
                      or entry.file_size > 1073741824
                      or entry.compress_size <= 0
                      or entry.file_size / entry.compress_size > 100
                  ):
                      raise SystemExit(f"unsafe ZIP entry: {name!r}")
                  total_size += entry.file_size
              if total_size > 2147483648:
                  raise SystemExit("ZIP uncompressed-size limit exceeded")
              corrupt = payload.testzip()
              if corrupt is not None:
                  raise SystemExit(f"ZIP CRC mismatch: {corrupt!r}")
          PY
          test ! -e "$RELEASE_PAYLOAD_DIRECTORY"
          mkdir -p "$RELEASE_PAYLOAD_DIRECTORY"
          unzip -q "$archive_path" -d "$RELEASE_PAYLOAD_DIRECTORY"
          test -z "$(
            find "$RELEASE_PAYLOAD_DIRECTORY" -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          expected_entries="$(
            printf '%s\n' \
              SHA256SUMS \
              direct-licenses.json \
              pip-audit.json \
              provenance.intoto.json \
              release-assets.sha256 \
              release-body.md \
              release-metadata.json \
              release-payload.json \
              runtime-image.cdx.json \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
              wheel.cdx.json | sort
          )"
          actual_entries="$(
            find "$RELEASE_PAYLOAD_DIRECTORY" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort
          )"
          test "$actual_entries" = "$expected_entries"
          verify_checksum_manifest_exact() {
            local checksum_file="$1"
            local checksum_line
            local checksum_name
            local expected_name
            local -A expected_names=()
            local -A observed_names=()
            shift
            test "$#" -gt 0
            test "$(stat --format='%s' "$checksum_file")" -le 4096
            for expected_name in "$@"; do
