          PY
          test ! -e "$PREPARED_DIRECTORY"
          mkdir -p "$PREPARED_DIRECTORY" "$RAW_EVIDENCE_DIRECTORY"
          unzip -q "$archive_path" -d "$PREPARED_DIRECTORY"
          test -z "$(
            find "$PREPARED_DIRECTORY" -mindepth 1 -maxdepth 1 ! -type f -print -quit
          )"
          expected_entries="$(
            printf '%s\n' \
              SHA256SUMS \
              direct-licenses.json \
              pip-audit.json \
              prepared-manifest.json \
              provenance.intoto.json \
              runtime-image.cdx.json \
              runtime-image.tar \
              schemabridge-0.1.0-py3-none-any.whl \
              trivy-image.json \
