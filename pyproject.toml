[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "schemabridge"
version = "0.1.0"
description = "Governed semantic query agent for inconsistent schemas, built on DataHub."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "SchemaBridge Hackathon Team" }]
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "hatch>=1.14,<2",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0,<7",
]
postgres = [
  # The pool extra installs the separately distributed psycopg_pool runtime.
  "psycopg[binary,pool]>=3.2,<4",
]
api = [
  # Direct dependencies: do not rely on Streamlit/DataHub's transitive ASGI/auth graph.
  "fastapi>=0.139,<1",
  "uvicorn[standard]>=0.46,<1",
  "PyJWT[crypto]>=2.13,<3",
]
sql = ["sqlglot>=26,<30"]
ui = [
  "streamlit[auth]>=1.59,<2",
  # Security floor for Streamlit's transitive GitPython dependency.
  "gitpython>=3.1.58,<4",
  # NumPy 2.3+ stubs use Python 3.12 syntax, while SchemaBridge type-checks at 3.11.
  "numpy>=1.26,<2.3",
]
datahub = [
  "acryl-datahub==1.6.0.15",
  "mcp==1.28.1",
  "uv==0.11.30",
]
llm = ["openai==2.46.0"]

[dependency-groups]
build = ["hatchling==1.27.0"]
supply-chain = ["pip-audit==2.10.1"]

[project.scripts]
schemabridge = "schemabridge.entrypoints.cli.main:app"
schemabridge-api = "schemabridge.entrypoints.http.main:main"
schemabridge-ai-policy = "schemabridge.entrypoints.ai_policy.main:main"
schemabridge-backup = "schemabridge.entrypoints.backup.main:main"
schemabridge-catalog = "schemabridge.entrypoints.catalog.main:main"
schemabridge-connector-route = "schemabridge.entrypoints.connector_route.main:main"
schemabridge-observer = "schemabridge.entrypoints.observer.main:main"
schemabridge-registry-publisher = "schemabridge.entrypoints.registry_publisher.main:main"
schemabridge-semantic-change = "schemabridge.entrypoints.semantic_change.main:main"
schemabridge-semantic-profile-worker = "schemabridge.entrypoints.semantic_profile_worker.main:main"
schemabridge-semantic-reconciler = "schemabridge.entrypoints.semantic_reconciler.main:main"
schemabridge-web = "schemabridge.entrypoints.streamlit.main:main"
schemabridge-worker = "schemabridge.entrypoints.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/schemabridge"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/control_plane" = "schemabridge/migrations/control_plane"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
markers = [
  "integration: requires local services",
  "acceptance: exercises a complete user path",
  "scale: exercises bounded-memory and indexed high-cardinality paths",
  "performance: measures wall-clock behavior and must run without coverage or service contention",
]

[tool.coverage.run]
source = ["schemabridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.uv]
required-version = "==0.11.30"

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "mcp", "mcp.*", "datahub", "datahub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit", "streamlit.*", "numpy", "numpy.*"]
follow_imports = "skip"
ignore_missing_imports = true
