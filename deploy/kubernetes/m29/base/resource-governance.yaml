apiVersion: v1
kind: ResourceQuota
metadata:
  name: schemabridge-production-budget
  namespace: schemabridge-system
spec:
  hard:
    pods: "40"
    requests.cpu: "8"
    requests.memory: 16Gi
    requests.ephemeral-storage: 8Gi
    limits.cpu: "24"
    limits.memory: 48Gi
    limits.ephemeral-storage: 24Gi
    services: "8"
    configmaps: "20"
    secrets: "12"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: schemabridge-container-bounds
  namespace: schemabridge-system
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 64Mi
      default:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 1Gi
      min:
        cpu: 25m
        memory: 64Mi
      max:
        cpu: "4"
        memory: 4Gi
        ephemeral-storage: 2Gi
    - type: Pod
      max:
        cpu: "8"
        memory: 8Gi
        ephemeral-storage: 4Gi
