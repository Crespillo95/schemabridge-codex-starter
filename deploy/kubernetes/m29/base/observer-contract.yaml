apiVersion: v1
kind: ConfigMap
metadata:
  name: schemabridge-observer-contract
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/name: schemabridge-observer
    app.kubernetes.io/part-of: schemabridge
    app.kubernetes.io/component: observer
data:
  contract-version: "2"
  ownership: schemabridge-runtime
  metrics-port: "9464"
  metrics-path: /metrics
  required-service-account: schemabridge-observer
  required-pod-label: app.kubernetes.io/name=schemabridge-observer
  required-network-label: app.kubernetes.io/component=observer
  executable-workload-included: "true"
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: schemabridge-observer
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/name: schemabridge-observer
    app.kubernetes.io/part-of: schemabridge
    app.kubernetes.io/component: observer
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: schemabridge-observer
  namespaceSelector:
    matchNames:
      - schemabridge-system
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
---
