apiVersion: v1
kind: ConfigMap
metadata:
  name: schemabridge-remote-secret-config
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/part-of: schemabridge
data:
  SCHEMABRIDGE_CONNECTOR_SECRET_MODE: remote
  SCHEMABRIDGE_CONNECTOR_SECRET_PROVIDER_URL: https://secret-manager.example.invalid
  SCHEMABRIDGE_CONNECTOR_SECRET_KV_MOUNT: replace-with-kv-v2-mount # gitleaks:allow -- mount name
  SCHEMABRIDGE_CONNECTOR_SECRET_CA_BUNDLE: /var/run/secrets/schemabridge/trust/ca.crt
  SCHEMABRIDGE_WORKLOAD_IDENTITY_TOKEN_FILE: /var/run/secrets/schemabridge/identity/token
  SCHEMABRIDGE_WORKLOAD_IDENTITY_ROOT: /var/run/secrets/schemabridge/identity
  SCHEMABRIDGE_WORKLOAD_IDENTITY_AUDIENCE: schemabridge-secret-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schemabridge-web-config
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/part-of: schemabridge
    app.kubernetes.io/component: web
data:
  SCHEMABRIDGE_ENVIRONMENT: production
  SCHEMABRIDGE_COMPONENT: web
  SCHEMABRIDGE_AUTH_MODE: oidc
  SCHEMABRIDGE_CONTROL_PLANE_MODE: postgres
  SCHEMABRIDGE_CATALOG_MODE: live
  SCHEMABRIDGE_REGISTRY_MODE: live
  SCHEMABRIDGE_PUBLICATION_MODE: disabled
  SCHEMABRIDGE_JUDGE_EXECUTION: disabled
  SCHEMABRIDGE_SEMANTIC_REGISTRY_SELECTION: active
  SCHEMABRIDGE_SEMANTIC_REGISTRY_ID: replace-with-registry-id
  SCHEMABRIDGE_SEMANTIC_REGISTRY_CATALOG_SCOPE: replace-with-catalog-scope
  SCHEMABRIDGE_QUERY_STUDIO_AI_MODE: disabled
  SCHEMABRIDGE_OIDC_PROVIDER: replace-with-oidc-provider
  SCHEMABRIDGE_OIDC_ISSUER: https://identity.example.invalid
  SCHEMABRIDGE_OIDC_AUDIENCE: replace-with-web-oidc-audience
  SCHEMABRIDGE_OIDC_ALLOWED_GROUPS: '{"schemabridge-analysts":["analyst"]}'
  SCHEMABRIDGE_OIDC_ALLOWED_TENANTS: '["replace-with-approved-tenant"]'
  SCHEMABRIDGE_CONTROL_AUDIT_KEY_VERSION: v1
  SCHEMABRIDGE_IDENTITY_MIGRATION_KEY_VERSION: v1
  SCHEMABRIDGE_PSEUDONYMIZATION_KEY_VERSION: v1
  SCHEMABRIDGE_CONNECTOR_SECRET_ROLE: replace-with-web-preflight-role
  SCHEMABRIDGE_CONNECTOR_SECRET_CAPABILITY: preflight
  SCHEMABRIDGE_SEMANTIC_REGISTRY_SECRET_ROLE: replace-with-web-registry-role
  SCHEMABRIDGE_SEMANTIC_REGISTRY_SECRET_BINDING_REF: replace-with-registry-reader-binding
  SCHEMABRIDGE_SEMANTIC_REGISTRY_SECRET_VERSION: "17"
---
