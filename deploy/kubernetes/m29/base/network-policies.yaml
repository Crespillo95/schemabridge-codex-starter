apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: schemabridge-system
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schemabridge-web
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 7860
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8520
    - to:
        - namespaceSelector:
            matchLabels:
              schemabridge.io/egress-plane: "true"
          podSelector:
            matchLabels:
              schemabridge.io/egress-capability: secret-manager
        - namespaceSelector:
            matchLabels:
              schemabridge.io/egress-plane: "true"
          podSelector:
            matchLabels:
              schemabridge.io/egress-capability: oidc
        - namespaceSelector:
            matchLabels:
              schemabridge.io/egress-plane: "true"
          podSelector:
            matchLabels:
              schemabridge.io/egress-capability: control-runtime
        - namespaceSelector:
            matchLabels:
              schemabridge.io/egress-plane: "true"
          podSelector:
            matchLabels:
              schemabridge.io/egress-capability: datahub-registry
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
