          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4317
    - to:
        - namespaceSelector:
            matchLabels:
              schemabridge.io/egress-plane: "true"
          podSelector:
            matchLabels:
              schemabridge.io/egress-capability: oidc
        - namespaceSelector:
