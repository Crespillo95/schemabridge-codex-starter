apiVersion: v1
kind: Service
metadata:
  name: schemabridge-web
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/name: schemabridge-web
    app.kubernetes.io/part-of: schemabridge
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schemabridge-web
  ports:
    - name: http
      port: 7860
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: schemabridge-api
  namespace: schemabridge-system
  labels:
    app.kubernetes.io/name: schemabridge-api
    app.kubernetes.io/part-of: schemabridge
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: schemabridge-api
  ports:
    - name: http
      port: 8520
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9464
      targetPort: metrics
      protocol: TCP
